function svcModal(id){
  const s=id?svcs.find(x=>x.id===id):{};
  const dur=s?.duration||60,hh=Math.floor(dur/60),mm=dur%60;
  // The service's standard "recipe" — materials + quantities that get
  // auto-added to every appointment that includes this service, so shampoo/
  // conditioner etc. don't need to be typed in by hand each visit but still
  // count toward that service's material cost and margin.
  let selMats=(s&&Array.isArray(s.defaultMaterials))?s.defaultMaterials.map(m=>({matId:m.matId,qty:m.qty})):[];
  let matSearchQ='';
  const matListSorted=[...mats].sort((x,y)=>x.name.localeCompare(y.name));
  const renderPickList=q=>{
    const ql=(q||'').toLowerCase();
    const filtered=matListSorted.filter(m=>!ql||m.name.toLowerCase().includes(ql));
    return filtered.length?filtered.map(m=>{
      const{unit}=matUnitInfo(m);
      return`<div style="padding:9px 12px;border-bottom:1px solid var(--brd);cursor:pointer;display:flex;justify-content:space-between" data-pickmat="${m.id}">
        <span style="font-size:13px">${m.name}</span><span style="font-size:11px;color:var(--mut)">${unit}</span>
      </div>`;
    }).join(''):'<div style="padding:12px;color:var(--dim);text-align:center;font-size:12px">Нічого не знайдено</div>';
  };
  function render(){
    const matRows=selMats.map((sm,i)=>{
      const m=mats.find(x=>x.id===sm.matId);
      const{unit,ppu}=m?matUnitInfo(m):{unit:'шт',ppu:0};
      const cost=(sm.qty||0)*ppu;
      return`<div style="background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:10px;margin-bottom:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div style="font-size:13px;font-weight:600">${m?.name||'?'}</div>
          <button class="bi bs" data-rmmat="${i}">${svg(ic.x,12,'var(--err)')}</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1">
            <div style="font-size:10px;color:var(--mut);margin-bottom:3px">Кількість (${unit}) на 1 послугу</div>
            <input type="number" step="0.1" value="${sm.qty||0}" style="width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:6px 8px;color:var(--txt);font-size:13px;outline:none" data-matqty="${i}" placeholder="0"/>
          </div>
          <div style="text-align:right;min-width:70px">
            <div style="font-size:10px;color:var(--mut)">Вартість</div>
            <div style="font-size:14px;font-weight:700;color:var(--sil)" data-matcost="${i}">${cost.toFixed(2)} грн</div>
          </div>
        </div>
      </div>`;
    }).join('');
    const totalMatCost=selMats.reduce((s2,sm)=>{const m=mats.find(x=>x.id===sm.matId);return s2+(sm.qty||0)*matUnitInfo(m).ppu;},0);
    $('modal').innerHTML=`
      <div class="mh"><div class="mt">${id?'Редагувати':'Нова послуга'}</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
      <div class="field"><label>Назва</label><input class="fi" id="sn" value="${s?.name||''}" placeholder="Стрижка, Фарбування..."/></div>
      <div class="field"><label>Ціна (грн)</label><input type="number" class="fi" id="sp" value="${s?.price||0}"/></div>
      <div class="field"><label>Тривалість</label>
        <div class="g2">
          <select class="fi" id="sdh">${Array.from({length:9},(_,i)=>`<option value="${i}" ${hh===i?'selected':''}>${i} год</option>`).join('')}</select>
          <select class="fi" id="sdm">${[0,15,30,45].map(m=>`<option value="${m}" ${mm===m?'selected':''}>${m} хв</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Стандартні матеріали на послугу ${selMats.length>0?`<span style="color:var(--acc);font-weight:700">${selMats.length} · ${totalMatCost.toFixed(2)} грн</span>`:''}</label>
        <div style="font-size:11px;color:var(--dim);margin-bottom:8px">Автоматично додаватимуться в кожен новий запис із цією послугою — вписувати шампунь/кондиціонер вручну щоразу не треба. Кількість можна буде підкоригувати прямо в записі.</div>
        ${matRows}
        <input class="fi" id="smsearch" style="margin-top:8px" placeholder="🔍 Пошук матеріалу..." value="${matSearchQ}"/>
        <div id="matPickList" style="max-height:160px;overflow-y:auto;border:1px solid var(--brd);border-radius:8px;margin-top:6px">${renderPickList(matSearchQ)}</div>
      </div>
      <div class="mf"><button class="btn bg" id="mc">Скасувати</button><button class="btn bp" id="ms">Зберегти</button></div>`;
    $('mx').onclick=hide;$('mc').onclick=hide;
    const capture=()=>{
      $('modal').querySelectorAll('[data-matqty]').forEach(inp=>{if(selMats[+inp.dataset.matqty])selMats[+inp.dataset.matqty].qty=+inp.value||0;});
      if($('smsearch'))matSearchQ=$('smsearch').value;
    };
    const bindPick=()=>{
      $('modal').querySelectorAll('[data-pickmat]').forEach(el2=>{
        el2.onclick=()=>{
          capture();
          selMats.push({matId:el2.dataset.pickmat,qty:0});
          matSearchQ='';
          render();
        };
      });
    };
    bindPick();
    $('smsearch').addEventListener('input',e=>{
      $('matPickList').innerHTML=renderPickList(e.target.value);
      bindPick();
    });
    $('modal').querySelectorAll('[data-rmmat]').forEach(b=>b.onclick=()=>{
      capture();
      selMats.splice(+b.dataset.rmmat,1);
      render();
    });
    $('modal').querySelectorAll('[data-matqty]').forEach(inp=>inp.addEventListener('input',e=>{
      const idx=+inp.dataset.matqty;
      selMats[idx].qty=+e.target.value||0;
      const m=mats.find(x=>x.id===selMats[idx].matId);
      const costEl=$('modal').querySelector(`[data-matcost="${idx}"]`);
      if(costEl)costEl.textContent=(selMats[idx].qty*matUnitInfo(m).ppu).toFixed(2)+' грн';
    }));
    $('ms').onclick=async()=>{
      capture();
      const d={name:$('sn').value,price:+$('sp').value,duration:+$('sdh').value*60 + +$('sdm').value,
        defaultMaterials:selMats.filter(sm=>sm.matId&&sm.qty>0).map(sm=>({matId:sm.matId,qty:sm.qty}))};
      if(!d.name||!d.price){alert('Заповніть поля');return;}
      bgWrites([id?updateDoc(doc(db,'services',id),d):addDoc(collection(db,'services'),d)],'svc-save');
      hide();
    };
  }
  show('');render();
}

// ANALYTICS
// ══════════════════════════════════════════════════
function drawStats(){
  const el=$('t-stats'),now2=new Date();
  // Default the custom range to today the first time it's needed, without
  // touching the module-load-time state (today() isn't defined yet at that
  // point in the file, so this has to happen lazily, at render time).
  if(!periodFrom)periodFrom=today();
  if(!periodTo)periodTo=today();
  // Single shared predicate for "is this date inside the selected period" —
  // used for appointments, purchases, and other expenses alike, so День /
  // Тиждень / Місяць / Рік / Період (довільний діапазон) all behave
  // consistently everywhere in this tab.
  const inSelPeriod=dateStr=>{
    if(!dateStr)return false;
    const d=new Date(dateStr+'T12:00:00');
    if(period==='day')return dateStr===today();
    if(period==='week'){const w=new Date(now2);w.setDate(now2.getDate()-7);return d>=w;}
    if(period==='month')return d.getMonth()===now2.getMonth()&&d.getFullYear()===now2.getFullYear();
    if(period==='year')return d.getFullYear()===now2.getFullYear();
    if(period==='custom')return dateStr>=periodFrom&&dateStr<=periodTo;
    return true;
  };
  const done=appts.filter(a=>a.status==='done'&&inSelPeriod(a.date));
  const recOps=ops.filter(o=>o.type==='receive'&&inSelPeriod(o.date));
  const saleOps=ops.filter(o=>o.type==='sale'&&inSelPeriod(o.date));
  const otherExps=exps.filter(o=>inSelPeriod(o.date));
  const rev=done.reduce((s,a)=>s+(a.paid||apptTotalPrice(a)),0);
  const exp=recOps.reduce((s,o)=>s+(o.total||0),0),profit=rev-exp,avg=done.length?rev/done.length:0;
  // Собівартість матеріалів, реально списаних під виконані записи (точний
  // варіант — сума materialCost, збереженого на кожному запису), і маржа
  // (виручка мінус ці матеріали), окремо від "Витрат"/"Прибутку" вище, які
  // рахуються по надходженнях на склад за період.
  const matCostTotal=done.reduce((s,a)=>s+(a.materialCost||0),0);
  const svcMargin=rev-matCostTotal, svcMarginPct=rev>0?(svcMargin/rev*100):0;
  // Інші (нематеріальні) витрати за період — оренда, податки, подарунки
  // тощо, введені у вкладці «Витрати». Чистий прибуток — це те, що
  // фактично залишається після собівартості матеріалів І цих витрат.
  const otherExpTotal=otherExps.reduce((s,o)=>s+(o.amount||0),0);
  // Чайові — окремі від "Виручки" (яка відображає ціну послуг), але це
  // реальні гроші в кишені, тож враховуються в "Чистому прибутку".
  const tipsTotal=done.reduce((s,a)=>s+(a.tips||0),0);
  // Роздрібний продаж товарів — виручка й маржа, окремі від виручки за
  // послуги (щоб не змішувати «зробили послугу» з «продали засіб»), але
  // маржа з продажів так само реальний прибуток і йде в Чистий прибуток.
  const salesRevenue=saleOps.reduce((s,o)=>s+(o.total||0),0);
  const salesCost=saleOps.reduce((s,o)=>s+(o.costTotal||0),0);
  const salesMargin=saleOps.reduce((s,o)=>s+(o.margin!==undefined?o.margin:(o.total||0)-(o.costTotal||0)),0);
  const netProfit=svcMargin-otherExpTotal+tipsTotal+salesMargin;
  // Прив'язка йде по "головній" послузі запису (a.serviceId), як і раніше —
  // для записів з кількома послугами вся собівартість матеріалів і час
  // запису відносяться на першу/головну послугу (той самий спрощений підхід,
  // що вже використовувався для виручки та графіка по днях тижня).
  const bySvc=svcs.map(sv=>{
    const apptsForSvc=done.filter(a=>a.serviceId===sv.id);
    const cnt=apptsForSvc.length;
    const rev=apptsForSvc.reduce((s,a)=>s+(a.paid||apptTotalPrice(a)),0);
    const matCost=apptsForSvc.reduce((s,a)=>s+(a.materialCost||0),0);
    const margin=rev-matCost;
    const marginPct=rev>0?(margin/rev*100):0;
    const totalMins=apptsForSvc.reduce((s,a)=>s+apptDuration(a),0);
    const marginPerHour=totalMins>0?margin/(totalMins/60):0;
    return{...sv,cnt,rev,matCost,margin,marginPct,marginPerHour};
  }).filter(s=>s.cnt>0).sort((a,b)=>b.rev-a.rev);
  const maxS=Math.max(...bySvc.map(s=>s.rev),1);
  // Структура продажу послуг — попит (частка к-сті записів) і рентабельність
  // (маржа %) поруч із виручкою, щоб бачити не лише "що приносить гроші",
  // а й "що часто замовляють" та "що вигідно робити" — це три різні речі.
  const svcTotalRev=bySvc.reduce((s,x)=>s+x.rev,0)||1;
  const svcTotalCnt=bySvc.reduce((s,x)=>s+x.cnt,0)||1;
  const bySvcStruct=bySvc.map(s=>({...s,revPct:s.rev/svcTotalRev*100,cntPct:s.cnt/svcTotalCnt*100}));
  const svcSorted=[...bySvcStruct].sort((a,b)=>{
    if(svcSort==='cnt')return b.cnt-a.cnt;
    if(svcSort==='margin')return b.marginPct-a.marginPct;
    return b.rev-a.rev;
  });
  // Donut завжди будується у фіксованому порядку (за виручкою), незалежно
  // від обраного сортування списку нижче — інакше кольори "стрибали" б при
  // перемиканні чіпів.
  const palette=['#A89BC2','#8A6D5C','#D4A853','#7BAF8A','#E07B39','#6B6380','#B87070','#5C8AA8','#C28FA8','#9CA85C'];
  let svcCum=0;
  const svcDonutStops=bySvcStruct.map((s,i)=>{
    const start=svcCum;svcCum+=s.revPct;
    return`${palette[i%palette.length]} ${start.toFixed(2)}% ${svcCum.toFixed(2)}%`;
  }).join(', ');
  const rentColor=pct=>pct>=50?'var(--ok)':pct>=25?'var(--wrn)':'var(--err)';
  // Структура продажу товарів (роздріб) — та сама логіка: попит (скільки
  // разів/скільки одиниць продано) і рентабельність (маржа %) по товару.
  const prodAgg={};
  saleOps.forEach(o=>{
    if(!prodAgg[o.matId])prodAgg[o.matId]={matId:o.matId,name:o.matName,cnt:0,qty:0,rev:0,margin:0};
    const p=prodAgg[o.matId];
    p.cnt+=1;p.qty+=o.qty||0;p.rev+=o.total||0;
    p.margin+=(o.margin!==undefined?o.margin:(o.total||0)-(o.costTotal||0));
  });
  const byProduct=Object.values(prodAgg).map(p=>({...p,marginPct:p.rev>0?(p.margin/p.rev*100):0}));
  const prodTotalRev=byProduct.reduce((s,p)=>s+p.rev,0)||1;
  const prodSorted=[...byProduct].sort((a,b)=>{
    if(prodSort==='cnt')return b.qty-a.qty;
    if(prodSort==='margin')return b.marginPct-a.marginPct;
    return b.rev-a.rev;
  });
  const maxProdRev=Math.max(...byProduct.map(p=>p.rev),1);
  // Топ фарб у використанні за обраний період — рахуємо і кількість разів
  // (скільки записів клієнтів її використовували, тобто "частота"), і сумарну
  // витрачену кількість/вартість, по матеріалах категорії "Фарби".
  const dyeAgg={};
  done.forEach(a=>(a.materialsUsed||[]).forEach(mu=>{

      ${recOps.length===0?'<div style="color:var(--dim);text-align:center;padding:20px 0">Немає</div>':recOps.slice(-8).reverse().map(o=>`
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--brd)">
          <div><div style="font-size:13px">${o.matName||'?'}</div><div style="font-size:11px;color:var(--mut)">${o.date} · ${o.qty} шт${o.disc?' · -'+o.disc+'%':''}</div></div>
          <div style="font-weight:700;color:var(--sil);white-space:nowrap">${fmt(o.total)} грн</div>
        </div>`).join('')}
    </div>
    <div class="card"><div class="sec" style="margin-top:0">Останні витрати</div>
      ${otherExps.length===0?'<div style="color:var(--dim);text-align:center;padding:20px 0">Немає</div>':otherExps.slice(0,8).map(o=>`
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--brd)">
          <div><div style="font-size:13px">${o.name||o.category||'?'}</div><div style="font-size:11px;color:var(--mut)">${o.date} · ${o.category||''}</div></div>
          <div style="font-weight:700;color:var(--err);white-space:nowrap">${fmt(o.amount)} грн</div>
        </div>`).join('')}
    </div>
    <div class="card"><div class="sec" style="margin-top:0">🛍️ Останні продажі</div>
      ${saleOps.length===0?'<div style="color:var(--dim);text-align:center;padding:20px 0">Немає</div>':saleOps.slice(-8).reverse().map(o=>`
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--brd)">
          <div><div style="font-size:13px">${o.matName||'?'}${o.note?' · '+o.note:''}</div><div style="font-size:11px;color:var(--mut)">${o.date} · ${o.qty} шт</div></div>
          <div style="text-align:right"><div style="font-weight:700;color:var(--sil);white-space:nowrap">${fmt(o.total)} грн</div>

        </div>`).join('')}
    </div>`;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{period=b.dataset.p;drawStats();});
  el.querySelectorAll('[data-ssort]').forEach(b=>b.onclick=()=>{svcSort=b.dataset.ssort;drawStats();});
  el.querySelectorAll('[data-psort]').forEach(b=>b.onclick=()=>{prodSort=b.dataset.psort;drawStats();});
  const pf=$('pdfrom'),pt=$('pdto');
  if(pf)pf.onchange=()=>{periodFrom=pf.value;drawStats();};
  if(pt)pt.onchange=()=>{periodTo=pt.value;drawStats();};
  // Tap-to-drill-down: each of these cards opens a modal listing exactly
  // which appointments/purchases/expenses make up that number for the
  // currently selected period, so the totals are auditable rather than
  // just trusted at face value.
  $('cardRev').onclick=()=>revenueDetailModal(done);
  $('cardExp').onclick=()=>purchasesDetailModal(recOps);
  $('cardMatCost').onclick=()=>materialsDetailModal(done);
  $('cardOtherExp').onclick=()=>expensesDetailModal(otherExps);
  $('cardSales').onclick=()=>salesDetailModal(saleOps);
}

// Drill-down modals for the clickable Аналітика cards ───────────────────
function revenueDetailModal(list){
  const sorted=[...list].sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
  const total=sorted.reduce((s,a)=>s+(a.paid||apptTotalPrice(a)),0);
  const rows=sorted.map(a=>{
    const svcNames=a.services?a.services.map(s=>{const sid=typeof s==='object'?s.serviceId:s;return svcs.find(sv=>sv.id===sid)?.name||'';}).filter(Boolean).join('+'):(svcs.find(sv=>sv.id===a.serviceId)?.name||'');
    const amt=a.paid||apptTotalPrice(a);
    return`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--brd)">
      <div><div style="font-size:13px;font-weight:600">${a.client||'—'}</div><div style="font-size:11px;color:var(--mut)">${fmtS(a.date)} ${a.time||''} · ${svcNames}</div></div>
      <div style="font-weight:700;color:var(--sil);white-space:nowrap">${fmt(amt)} грн</div>
    </div>`;
  }).join('');
  show(`<div class="mh"><div class="mt">Виручка — деталізація</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
    <div style="text-align:right;font-weight:700;font-size:15px;color:var(--sil);margin-bottom:8px">Разом: ${fmt(total)} грн · ${sorted.length} записів</div>
    ${sorted.length===0?'<div class="empty">Немає записів за цей період</div>':rows}`);
  $('mx').onclick=hide;
}

function materialsDetailModal(list){
  const agg={};
  list.forEach(a=>(a.materialsUsed||[]).forEach(mu=>{
    if(!agg[mu.matId])agg[mu.matId]=0;
    agg[mu.matId]+=mu.qty||0;
  }));
  const rows=Object.entries(agg).map(([matId,qty])=>{
    const m=mats.find(x=>x.id===matId);
    const{unit,ppu}=m?matUnitInfo(m):{unit:'шт',ppu:0};
    return{name:m?.name||'?',qty,unit,cost:qty*ppu};
  }).sort((a,b)=>b.cost-a.cost);
  const total=rows.reduce((s,r)=>s+r.cost,0);
  const rowsHtml=rows.map(r=>`
    <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--brd)">
      <div><div style="font-size:13px;font-weight:600">${r.name}</div><div style="font-size:11px;color:var(--mut)">${fmt(r.qty)} ${r.unit}</div></div>
      <div style="font-weight:700;color:var(--wrn);white-space:nowrap">${fmt(r.cost)} грн</div>
    </div>`).join('');
  show(`<div class="mh"><div class="mt">Собівартість матеріалів — деталізація</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:8px">Порахована за поточними цінами матеріалів — може трохи відрізнятись від збереженої на момент запису, якщо ціни відтоді змінювались.</div>
    <div style="text-align:right;font-weight:700;font-size:15px;color:var(--sil);margin-bottom:8px">Разом: ${fmt(total)} грн</div>
    ${rows.length===0?'<div class="empty">Матеріали не використовувались</div>':rowsHtml}`);
  $('mx').onclick=hide;
}

    const m=o.margin!==undefined?o.margin:(o.total||0)-(o.costTotal||0);

      <div><div style="font-size:13px">${o.matName||'?'}${o.note?' · '+o.note:''}</div><div style="font-size:11px;color:var(--mut)">${fmtS(o.date)} · ${o.qty} шт · ${(o.price||0).toFixed(2)} грн/шт</div></div>
      <div style="text-align:right"><div style="font-weight:700;color:var(--sil);white-space:nowrap">${fmt(o.total)} грн</div>
      <div style="font-size:11px;color:${m>=0?'var(--ok)':'var(--err)'}">маржа ${fmt(m)} грн</div></div>

    <div style="text-align:right;font-weight:700;font-size:15px;color:var(--sil);margin-bottom:2px">Разом: ${fmt(total)} грн</div>
    <div style="text-align:right;font-size:13px;font-weight:600;color:${margin>=0?'var(--ok)':'var(--err)'};margin-bottom:8px">Маржа: ${fmt(margin)} грн</div>

// ══════════════════════════════════════════════════
// EXPENSES (Витрати) — rent, taxes, gifts, and other non-material costs.
// Entered manually each time (no auto-recurring projection) so the person
// stays in control of exactly what was actually paid and when.
// ══════════════════════════════════════════════════
function drawExp(){
  const el=$('t-exp'),now=new Date();
  const inPeriod=o=>{
    const d=new Date(o.date+'T12:00:00');
    if(expPeriod==='week'){const w=new Date(now);w.setDate(now.getDate()-7);return d>=w;}
    if(expPeriod==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(expPeriod==='year')return d.getFullYear()===now.getFullYear();
    return true; // 'all'
  };
  const cats=getExpCats();
  const fil=exps.filter(o=>inPeriod(o)&&(expCat==='Всі'||o.category===expCat));
  const total=fil.reduce((s,o)=>s+(o.amount||0),0);
  el.innerHTML=`
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button class="btn bp bs" id="beadd">${svg(ic.plus,14)} Витрата</button>
    </div>
    <div class="chips">${[['week','Тиждень'],['month','Місяць'],['year','Рік'],['all','Увесь час']].map(([k,l])=>`<button class="chip ${expPeriod===k?'on':''}" data-ep="${k}">${l}</button>`).join('')}</div>
    <div class="card" style="text-align:center;margin-bottom:12px">
      <div class="sv" style="color:var(--err)">${fmt(total)} грн</div>
      <div class="sl">Разом${expCat==='Всі'?'':' · '+expCat}</div>
    </div>
    <div class="chips">${['Всі',...cats].map(c=>`<button class="chip ${expCat===c?'on':''}" data-ec="${c}">${c}</button>`).join('')}</div>
    ${fil.length===0?'<div class="empty">Витрат немає</div>':fil.map(o=>`
      <div class="ri">
        <div class="rl"><div class="rn">${o.name||o.category||'Витрата'}</div><div class="rs">${o.category||''} · ${o.date}${o.note?' · '+o.note:''}</div></div>
        <div class="rr"><div class="rv" style="color:var(--err)">${fmt(o.amount)} грн</div></div>
        <div class="rac">
          <button class="bi bs" data-ee="${o.id}">${svg(ic.edit,13)}</button>
          <button class="bi bs" data-ed="${o.id}">${svg(ic.del,13,'var(--err)')}</button>
        </div>
      </div>`).join('')}`;
  $('beadd').onclick=()=>expModal(null);
  el.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{expPeriod=b.dataset.ep;drawExp();});
  el.querySelectorAll('[data-ec]').forEach(b=>b.onclick=()=>{expCat=b.dataset.ec;drawExp();});
  el.querySelectorAll('[data-ee]').forEach(b=>b.onclick=()=>expModal(b.dataset.ee));
  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{if(confirm('Видалити?'))bgWrites([deleteDoc(doc(db,'expenses',b.dataset.ed))],'exp-del');});
}

function expModal(id){
  const o=id?exps.find(x=>x.id===id):null;
  let selCat=o?.category||null;
  function render(){
    const cats=getExpCats();
    if(!selCat||!cats.includes(selCat))selCat=cats[0];
    $('modal').innerHTML=`
      <div class="mh"><div class="mt">${id?'Редагувати витрату':'Нова витрата'}</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
      <div class="field"><label>Назва</label><input class="fi" id="en" value="${o?.name||''}" placeholder="Оренда за липень, Податок ЄП..."/></div>
      <div class="field"><label>Категорія</label><select class="fi" id="ecat">
        ${cats.map(c=>`<option value="${c}" ${selCat===c?'selected':''}>${c}</option>`).join('')}
        <option value="__new__">+ Нова категорія...</option>
      </select></div>
      <div class="field"><label>Сума (грн)</label><input type="number" class="fi" id="eam" value="${o?.amount||0}"/></div>
      <div class="field"><label>Дата</label><input type="date" class="fi" id="edate" value="${o?.date||today()}"/></div>
      <div class="field"><label>Примітка</label><textarea class="fi" id="enote">${o?.note||''}</textarea></div>
      <div class="mf">
        ${id?`<button class="btn bd bs" id="edel">Видалити</button>`:''}
        <button class="btn bg" id="ecancel">Скасувати</button>
        <button class="btn bp" id="esave">Зберегти</button>
      </div>`;
    $('mx').onclick=hide;$('ecancel').onclick=hide;
    $('ecat').onchange=e=>{
      if(e.target.value==='__new__'){
        const name=(prompt('Назва нової категорії:')||'').trim();
        if(name&&!BASE_EXP_CATS.includes(name)&&!customExpCats.includes(name)){
          customExpCats.push(name);
          localStorage.setItem('expCats',JSON.stringify(customExpCats));
        }
        selCat=name||selCat;
        render();
      } else {
        selCat=e.target.value;
      }
    };
    $('esave').onclick=async()=>{
      const name=$('en').value.trim();
      const amount=+$('eam').value||0;
      if(!name||!amount){alert('Заповніть назву і суму');return;}
      const data={name,category:selCat,amount,date:$('edate').value,note:$('enote').value};
      bgWrites([id?updateDoc(doc(db,'expenses',id),data):addDoc(collection(db,'expenses'),data)],'exp-save');
      hide();
    };
    if(id)$('edel').onclick=()=>{if(confirm('Видалити?')){bgWrites([deleteDoc(doc(db,'expenses',id))],'exp-del2');hide();}};
  }
  show('');render();
}

// Контакт може бути Instagram (@nick, посилання) або телефон. Повертає ключ або ''.
const normContact=v=>{
  v=(v||'').trim().toLowerCase();if(!v)return'';
  if(/^[\d\s+()\-]+$/.test(v)){const d=v.replace(/\D/g,'');return d.length>=9?'p'+d.slice(-9):'';}
  const h=v.replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/^@/,'').replace(/[\/?#].*$/,'').trim();
  return h?'i'+h:'';
};
const contactLink=v=>{
  const k=normContact(v);if(!k)return'';
  return k[0]==='p'?'tel:+'+(v.replace(/\D/g,'')):'https://instagram.com/'+k.slice(1);
};
const apptSvcIds=a=>a.services&&Array.isArray(a.services)?a.services.map(s=>typeof s==='object'?s.serviceId:s):(a.serviceId?[a.serviceId]:[]);

let _clCache={v:-1,d:'',val:null};
function buildClients(){const t=today();if(_clCache.v===dataVer&&_clCache.d===t)return _clCache.val;_clCache={v:dataVer,d:t,val:buildClientsRaw()};return _clCache.val;}
function buildClientsRaw(){
  const nk=a=>a.client.trim().toLowerCase().replace(/\s+/g,' ');
  const real=appts.filter(a=>!a.isBreak&&a.client&&a.client.trim());
  const nameToContact={};
  real.forEach(a=>{const p=normContact(a.phone);if(p)nameToContact[nk(a)]=p;});
  const keyOf=a=>{const p=normContact(a.phone);if(p)return p;return nameToContact[nk(a)]||'n'+nk(a);};
  const map={};
  real.forEach(a=>{
    const k=keyOf(a);
    const c=map[k]||(map[k]={key:k,name:a.client.trim(),phone:'',all:[]});
    c.all.push(a);
    if(!c.phone&&a.phone)c.phone=a.phone;
  });
  const todayStr=today(),dayMs=86400000;
  const diff=(d1,d2)=>Math.round((new Date(d2+'T12:00:00')-new Date(d1+'T12:00:00'))/dayMs);
  return Object.values(map).map(c=>{
    const live=c.all.filter(a=>a.status!=='cancelled'&&a.status!=='noshow');
    const done=live.filter(a=>a.status==='done');
    const doneDates=[...new Set(done.map(a=>a.date))].sort();
    const next=live.filter(a=>(a.status==='pending'||a.status==='confirmed')&&a.date>=todayStr).sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||'')))[0]||null;
    const gaps=[];
    for(let i=1;i<doneDates.length;i++)gaps.push(diff(doneDates[i-1],doneDates[i]));
    const avgGap=gaps.length?gaps.reduce((s,g)=>s+g,0)/gaps.length:null;
    const lastDone=doneDates[doneDates.length-1]||null;
    const daysSince=lastDone?diff(lastDone,todayStr):null;
    const threshold=avgGap?Math.max(21,avgGap*1.5):45;
    const booked=!!next;
    const overdue=!booked&&daysSince!==null&&daysSince>threshold;
    const lost=overdue&&daysSince>Math.max(90,threshold*2);
    let expected=null;
    if(lastDone&&avgGap){const d=new Date(lastDone+'T12:00:00');d.setDate(d.getDate()+Math.round(avgGap));expected=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    const totalPaid=done.reduce((s,a)=>s+(a.paid||apptTotalPrice(a)),0);
    const tips=done.reduce((s,a)=>s+(a.tips||0),0);
    return{...c,doneCount:done.length,doneVisits:doneDates.length,firstDone:doneDates[0]||null,lastDone,daysSince,avgGap,
      next,booked,overdue,lost,expected,totalPaid,tips,cancelled:c.all.filter(a=>a.status==='cancelled').length,noshow:c.all.filter(a=>a.status==='noshow').length,source:((c.all.filter(a=>a.source).sort((x,y)=>(y.date||'').localeCompare(x.date||''))[0])||{}).source||'',
      avgCheck:done.length?totalPaid/done.length:0};
  });
}

function clientsListModal(){
  let cq='',seg='all',sortMode='recent';
  function render(){
    const all=buildClients();
    const withDone=all.filter(c=>c.doneVisits>=1);
    const total=all.length;
    const monthKey=today().slice(0,7);
    const newMonth=all.filter(c=>c.firstDone&&c.firstDone.slice(0,7)===monthKey).length;
    const returning=withDone.filter(c=>c.doneVisits>=2).length;
    const retPct=withDone.length?returning/withDone.length*100:0;
    const gaps=all.filter(c=>c.avgGap!=null).map(c=>c.avgGap);
    const avgFreq=gaps.length?gaps.reduce((s,g)=>s+g,0)/gaps.length:null;
    const doneTotal=all.reduce((s,c)=>s+c.doneCount,0);
    const revTotal=all.reduce((s,c)=>s+c.totalPaid,0);
    const avgCheck=doneTotal?revTotal/doneTotal:0;
    const overdueN=all.filter(c=>c.overdue).length;
    const segs=[['all','Всі',all.length],['new','Нові (1 візит)',all.filter(c=>c.doneVisits===1).length],
      ['regular','Постійні (3+)',all.filter(c=>c.doneVisits>=3).length],
      ['overdue','⏰ Пора нагадати',overdueN],['lost','Втрачені',all.filter(c=>c.lost).length]];
    let list=all.filter(c=>{
      if(seg==='new')return c.doneVisits===1;
      if(seg==='regular')return c.doneVisits>=3;
      if(seg==='overdue')return c.overdue;
      if(seg==='lost')return c.lost;
      return true;
    });
    if(cq){const ql=cq.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(ql)||(c.phone||'').toLowerCase().includes(ql));}
    list.sort((a,b)=>{
      if(sortMode==='visits')return b.doneVisits-a.doneVisits;
      if(sortMode==='spend')return b.totalPaid-a.totalPaid;
      if(seg==='overdue'||seg==='lost')return (b.daysSince||0)-(a.daysSince||0);
      return (b.lastDone||'').localeCompare(a.lastDone||'');
    });
    const plural=n=>n===1?'візит':(n>=2&&n<=4)?'візити':'візитів';
    const rows=list.map(c=>{
      const badge=c.lost?'<span style="background:rgba(184,112,112,.15);color:var(--err);padding:2px 7px;border-radius:10px;font-size:10px">втрачена?</span>'
        :c.overdue?'<span style="background:rgba(196,164,106,.18);color:var(--wrn);padding:2px 7px;border-radius:10px;font-size:10px">⏰ пора нагадати</span>'
        :c.booked?'<span style="background:rgba(123,175,138,.18);color:var(--ok);padding:2px 7px;border-radius:10px;font-size:10px">записана</span>':'';
      const line2=c.lastDone?`останній ${fmtS(c.lastDone)} · ${c.daysSince} дн. тому`:'ще не було виконаних візитів';
      const line3=c.booked?`наступний: ${fmtS(c.next.date)}${c.next.time?' '+c.next.time:''}`
        :c.expected?`зазвичай раз на ${Math.round(c.avgGap)} дн. · очікуємо ~${fmtS(c.expected)}`:'';
      const tel=c.phone&&contactLink(c.phone)?`<a href="${contactLink(c.phone)}" target="_blank" rel="noopener" data-tel style="text-decoration:none;font-size:16px;padding:4px 6px">${normContact(c.phone)[0]==='i'?'💬':'📞'}</a>`:'';
      return`<div class="ri" data-ckey="${c.key}" style="cursor:pointer;align-items:flex-start">
        <div class="rl"><div class="rn">${c.name} ${badge}</div>
          <div class="rs">${c.doneVisits} ${plural(c.doneVisits)}${c.cancelled?' · скасувань: '+c.cancelled:''}${c.noshow?' · не прийшла: '+c.noshow:''}${c.phone?' · '+c.phone:''}</div>
          <div class="rs">${line2}</div>${line3?`<div class="rs">${line3}</div>`:''}</div>
        <div class="rr"><div class="rv">${fmt(c.totalPaid)} грн</div><div class="ra">чек ${fmt(c.avgCheck)}</div>${tel}</div>
      </div>`;
    }).join('');
    $('modal').innerHTML=`
      <div class="mh"><div class="mt">👤 Клієнти</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
      <div class="sg" style="margin-bottom:12px">
        <div class="sc"><div class="sv" style="color:var(--sil)">${total}</div><div class="sl">Всього клієнтів</div></div>
        <div class="sc"><div class="sv" style="color:var(--acs)">${newMonth}</div><div class="sl">Нових цього місяця</div></div>
        <div class="sc"><div class="sv" style="color:var(--ok)">${retPct.toFixed(0)}%</div><div class="sl">Повернулись (2+ візити)</div></div>
        <div class="sc"><div class="sv" style="color:var(--sil)">${avgFreq?Math.round(avgFreq)+' дн.':'—'}</div><div class="sl">Сер. інтервал між візитами</div></div>
        <div class="sc"><div class="sv" style="color:var(--sil)">${fmt(avgCheck)} грн</div><div class="sl">Сер. чек</div></div>
        <div class="sc" id="cardOverdue" style="cursor:pointer"><div class="sv" style="color:${overdueN?'var(--wrn)':'var(--mut)'}">${overdueN}</div><div class="sl">⏰ Пора нагадати</div></div>
      </div>
      <button class="btn bg bs" id="cmerge" style="margin-bottom:10px">🔗 Об'єднати дублі</button>
      <input class="fi" id="cq" style="margin-bottom:10px" placeholder="🔍 Ім'я або @instagram..." value="${cq}"/>
      <div class="chips">${segs.map(([k,l,n])=>`<button class="chip ${seg===k?'on':''}" data-seg="${k}">${l} · ${n}</button>`).join('')}</div>
      <div class="chips">${[['recent','Останні'],['visits','За візитами'],['spend','За сумою']].map(([k,l])=>`<button class="chip ${sortMode===k?'on':''}" data-sort="${k}">${l}</button>`).join('')}</div>
      ${list.length===0?'<div class="empty">Клієнтів не знайдено</div>':rows}`;
    $('mx').onclick=hide;
    $('cq').addEventListener('input',e=>{cq=e.target.value;render();setTimeout(()=>{const el2=$('cq');if(el2){el2.focus();el2.setSelectionRange(el2.value.length,el2.value.length);}},10);});
    $('modal').querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{seg=b.dataset.seg;render();});
    $('modal').querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;render();});
    $('cmerge').onclick=()=>mergeClientModal();
    $('cardOverdue').onclick=()=>{seg='overdue';render();};
    $('modal').querySelectorAll('[data-ckey]').forEach(el2=>el2.onclick=()=>clientHistoryModal(el2.dataset.ckey));
    $('modal').querySelectorAll('[data-tel]').forEach(a=>a.onclick=e=>e.stopPropagation());
  }
  show('');render();
}

function clientHistoryModal(arg){
  const all=buildClients(),nm=String(arg).trim().toLowerCase();
  const c=all.find(x=>x.key===arg)||all.find(x=>x.all.some(a=>a.client.trim().toLowerCase()===nm));
  const clientName=c?c.name:String(arg).trim();
  const visits=c?[...c.all].sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||''))):[];
  const rows=visits.map(a=>{
    const svcNames=apptSvcIds(a).map(id=>svcs.find(sv=>sv.id===id)?.name||'').filter(Boolean).join('+');
    const amt=a.paid||apptTotalPrice(a);
    const statusLbl=({done:'Виконано',cancelled:'Скасовано',noshow:'Не прийшла',confirmed:'Підтверджена'})[a.status]||'Очікує';
    const statusColor=({done:'var(--ok)',cancelled:'var(--err)',noshow:'var(--wrn)',confirmed:'#5C8AA8'})[a.status]||'var(--acs)';
    return`<div class="ri" data-appt="${a.id}" style="cursor:pointer">
      <div class="rl"><div class="rn">${fmtS(a.date)}${a.time?' · '+a.time:''}</div><div class="rs">${svcNames||'—'}</div>
        <div class="rs" style="color:${statusColor}">${statusLbl}${a.note?' · '+a.note:''}</div>${recipeShort(a)}</div>
      <div class="rr"><div class="rv">${a.status==='cancelled'?'—':fmt(amt)+' грн'}</div>${a.materialCost?`<div class="ra">матер. ${fmt(a.materialCost)} грн</div>`:''}</div>
    </div>`;
  }).join('');
  show(`<div class="mh"><div class="mt">${clientName}</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
    ${c&&c.phone?`<div style="font-size:12px;color:var(--mut);margin-bottom:10px">${normContact(c.phone)[0]==='i'?'💬':'📞'} <a href="${contactLink(c.phone)}" target="_blank" rel="noopener" style="color:var(--acs)">${c.phone}</a></div>`:''}
    <div class="sg" style="margin-bottom:12px">
      <div class="sc"><div class="sv" style="color:var(--sil)">${c?c.doneVisits:0}</div><div class="sl">Виконаних візитів</div></div>
      <div class="sc"><div class="sv" style="color:var(--acs)">${fmt(c?c.totalPaid:0)} грн</div><div class="sl">Разом сплачено</div></div>
      <div class="sc"><div class="sv" style="color:var(--sil)">${fmt(c?c.avgCheck:0)} грн</div><div class="sl">Сер. чек</div></div>
      <div class="sc"><div class="sv" style="color:var(--sil)">${c&&c.avgGap?Math.round(c.avgGap)+' дн.':'—'}</div><div class="sl">Сер. інтервал</div></div>
    </div>
    ${c&&c.booked?`<div class="alert" style="background:rgba(123,175,138,.12);border:1px solid rgba(123,175,138,.4);color:var(--ok)">Наступний запис: ${fmtS(c.next.date)}${c.next.time?' '+c.next.time:''}</div>`
      :c&&c.expected?`<div class="alert" style="background:rgba(196,164,106,.12);border:1px solid rgba(196,164,106,.4);color:var(--wrn)">${c.overdue?'⏰ Пора нагадати — ':''}очікуваний візит ~${fmtS(c.expected)}</div>`:''}
    <button class="btn bp" id="crebook" style="width:100%;justify-content:center;margin-bottom:12px">${svg(ic.plus,14)} Записати знову</button>
    ${visits.length===0?'<div class="empty">Візитів не знайдено</div>':rows}`);
  $('mx').onclick=hide;
  $('crebook').onclick=()=>apptModal(null,calDate,'10:00',{client:clientName,phone:c?c.phone:''});
  $('modal').querySelectorAll('[data-appt]').forEach(el2=>el2.onclick=()=>{const a=appts.find(x=>x.id===el2.dataset.appt);if(a)apptModal(a,a.date,a.time);});
}

// Об'єднання дублів: усі записи клієнта «дубль» перейменовуються на ім'я
// клієнта «залишити». Зворотної дії немає — спочатку дивіться, що обрали.
function mergeClientModal(){
  const all=[...buildClients()].sort((a,b)=>a.name.localeCompare(b.name,'uk'));
  const opts=(sel)=>all.map(c=>`<option value="${c.key}" ${c.key===sel?'selected':''}>${c.name} (${c.all.length} зап.)</option>`).join('');
  show(`<div class="mh"><div class="mt">🔗 Об'єднати дублі</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
    <div class="field"><label>Дубль (зникне)</label><select class="fi" id="mfrom"><option value="">— оберіть —</option>${opts('')}</select></div>
    <div class="field"><label>Залишити (основний)</label><select class="fi" id="mto"><option value="">— оберіть —</option>${opts('')}</select></div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:13px">Усі записи «дубля» стануть записами основного клієнта. Скасувати це не можна.</div>
    <div class="mf"><button class="btn bg" id="mcn">Скасувати</button><button class="btn bp" id="mgo">Об'єднати</button></div>`);
  $('mx').onclick=hide;$('mcn').onclick=()=>clientsListModal();
  $('mgo').onclick=async()=>{
    const f=all.find(c=>c.key===$('mfrom').value),t=all.find(c=>c.key===$('mto').value);
    if(!f||!t||f.key===t.key){alert('Оберіть двох різних клієнтів');return;}
    if(!confirm(`Перенести ${f.all.length} запис(ів) «${f.name}» → «${t.name}»?`))return;
    const ws=[];
    for(const a of f.all){
      const upd={client:t.name};
      if(!a.phone&&t.phone)upd.phone=t.phone;
      Object.assign(a,upd);  // одразу в пам’яті, щоб список оновився без очікування сервера
      ws.push(updateDoc(doc(db,'appointments',a.id),upd));
    }
    dataVer++;
    bgWrites(ws,'merge');
    clientsListModal();
  };
}

function clientsStatsHtml(done,inSelPeriod,avg){
  // ── Клієнти та популярність послуг за обраний період ──
  const clAll=buildClients(),apptToCl={};
  clAll.forEach(c=>c.all.forEach(a=>{apptToCl[a.id]=c;}));
  const perCl={};
  done.forEach(a=>{const c=apptToCl[a.id];if(!c)return;const p=perCl[c.key]||(perCl[c.key]={c,visits:0,rev:0});p.visits++;p.rev+=(a.paid||apptTotalPrice(a));});
  const pcl=Object.values(perCl);
  const pclNew=pcl.filter(p=>p.c.firstDone&&inSelPeriod(p.c.firstDone)).length;
  const pclRet=pcl.length-pclNew;
  const pclBooked=pcl.filter(p=>p.c.booked).length;
  const visitsPerCl=pcl.length?done.length/pcl.length:0;
  const topCl=[...pcl].sort((a,b)=>b.rev-a.rev).slice(0,5);
  const baseGaps=clAll.filter(c=>c.avgGap!=null).map(c=>c.avgGap);
  const baseFreq=baseGaps.length?baseGaps.reduce((s,g)=>s+g,0)/baseGaps.length:null;
  const svcCnt={};
  done.forEach(a=>[...new Set(apptSvcIds(a))].forEach(id=>{svcCnt[id]=(svcCnt[id]||0)+1;}));
  const topSvc=Object.entries(svcCnt).map(([id,n])=>({name:svcs.find(s=>s.id===id)?.name||'?',n})).sort((a,b)=>b.n-a.n).slice(0,6);
  const maxSvcN=Math.max(...topSvc.map(s=>s.n),1);
  const clientsCardHtml=`
    <div class="card"><div class="sec" style="margin-top:0">👤 Клієнти за період</div>
      <div class="sg" style="margin-bottom:10px">
        <div class="sc"><div class="sv" style="color:var(--sil)">${pcl.length}</div><div class="sl">Унікальних клієнтів</div></div>
        <div class="sc"><div class="sv" style="color:var(--acs)">${pclNew} / ${pclRet}</div><div class="sl">Нові / Повторні</div></div>
        <div class="sc"><div class="sv" style="color:var(--sil)">${visitsPerCl.toFixed(1)}</div><div class="sl">Візитів на клієнта</div></div>
        <div class="sc"><div class="sv" style="color:var(--ok)">${pcl.length?Math.round(pclBooked/pcl.length*100):0}%</div><div class="sl">Мають наступний запис</div></div>
      </div>
      <div style="font-size:11px;color:var(--mut);margin-bottom:8px">Сер. чек: <b style="color:var(--sil)">${fmt(avg)} грн</b> · сер. інтервал між візитами по базі: <b style="color:var(--sil)">${baseFreq?Math.round(baseFreq)+' дн.':'—'}</b></div>
      ${topCl.length?`<div style="font-size:11px;font-weight:700;color:var(--mut);margin:8px 0 4px">ТОП КЛІЄНТІВ ЗА ВИРУЧКОЮ</div>`+topCl.map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--brd);font-size:13px"><span>${p.c.name} <span style="color:var(--dim)">×${p.visits}</span></span><b style="color:var(--sil)">${fmt(p.rev)} грн</b></div>`).join(''):''}
      <button class="btn bg bs" id="openClients" style="margin-top:10px;width:100%;justify-content:center">Відкрити базу клієнтів</button>
    </div>
    <div class="card"><div class="sec" style="margin-top:0">🔥 Найпопулярніші послуги (за кількістю)</div>
      ${topSvc.length===0?'<div style="color:var(--dim);text-align:center;padding:20px 0">Немає даних</div>':topSvc.map(s=>`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px">${s.name}</span><span style="font-weight:700;color:var(--sil)">×${s.n} <span style="color:var(--dim);font-weight:400">(${Math.round(s.n/done.length*100)}% візитів)</span></span></div>
        <div class="pb"><div class="pf" style="width:${s.n/maxSvcN*100}%"></div></div></div>`).join('')}
    </div>`;

  return clientsCardHtml;
}

// кнопка «Відкрити базу клієнтів» в Аналітиці
document.addEventListener('click',e=>{if(e.target.closest('#openClients'))clientsListModal();});

draw();
setInterval(()=>{ if(tab==='cal'&&!$('overlay').classList.contains('show')) drawCal(); }, 60000);
</script>
</body>
</html>
