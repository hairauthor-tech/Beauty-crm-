      <div id="recipeBox"></div>
      <div class="field"><label>Послуги <span id="svcHeaderInfo" style="color:var(--acc);font-weight:700">${selSvcs.length>0?`${selSvcs.length} · ${fmt(totalPrice)} грн · ${fmtTotalDur(shownDur)}`:''}</span></label>
        ${selRows}
        <select class="fi" id="fsadd" style="margin-top:8px">
          <option value="">+ Додати послугу</option>${opts}
        </select>
      </div>
      <div class="field"><label>Формула (фарбування) <span data-savenote style="color:var(--dim);font-weight:400;text-transform:none;font-size:11px"></span></label><textarea class="fi" id="fform" placeholder="напр. 6.1 + 7.0 (1:1), окисл. 6%, пропорція 1:1,5, 35 хв">${escH(fFormula)}</textarea></div>
      <div class="field"><label>Матеріали на запис <span id="matHeaderInfo" style="color:var(--acc);font-weight:700">${selMats.length>0?`${selMats.length} · ${totalMatCost.toFixed(2)} грн`:''}</span> <span id="matSaveStatus" data-savenote style="color:var(--dim);font-weight:400;text-transform:none;font-size:11px"></span></label>
        ${matRows}
        <input class="fi" id="fmsearch" style="margin-top:8px" placeholder="🔍 Пошук матеріалу..." value="${matSearchQ}"/>
        <div id="matPickList" style="max-height:160px;overflow-y:auto;border:1px solid var(--brd);border-radius:8px;margin-top:6px">${renderMatPickList(matSearchQ)}</div>
      </div>
      <div class="card" style="margin-bottom:13px;padding:12px 14px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:var(--mut)">Собівартість матеріалів:</span><span id="fmatcosttxt" style="font-weight:700;color:var(--err)">${totalMatCost.toFixed(2)} грн</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--mut)">Маржа:</span><span id="fmargintxt" style="font-weight:700;color:${margin>=0?'var(--ok)':'var(--err)'}">${fmt(margin)} грн (${marginPct.toFixed(0)}%)</span></div>
      </div>
      <div class="field"><label>Тривалість запису в календарі <span id="durNote" style="color:var(--mut);font-weight:400;text-transform:none">${durOverride!==null&&durOverride!==totalDurMin?'(змінено вручну)':''}</span></label>
        <div class="g2">
          <select class="fi" id="fdh">${Array.from({length:9},(_,i)=>`<option value="${i}" ${curH===i?'selected':''}>${i} год</option>`).join('')}</select>
          <select class="fi" id="fdm">${[0,15,30,45].map(m=>`<option value="${m}" ${curM===m?'selected':''}>${m} хв</option>`).join('')}</select>
        </div>
      </div>
      <div class="g2">
        <div class="field"><label>Дата</label><input type="date" class="fi" id="fd" value="${fDate}"/></div>
        <div class="field"><label>Час</label><input type="time" class="fi" id="ft" value="${fTime}"/></div>
      </div>
      <div class="field"><label>Статус</label><select class="fi" id="fst">
        <option value="pending" ${fStatus==='pending'?'selected':''}>Очікує</option>
        <option value="confirmed" ${fStatus==='confirmed'?'selected':''}>Підтверджена</option>
        <option value="done" ${fStatus==='done'?'selected':''}>Виконано (прийшла)</option>
        <option value="noshow" ${fStatus==='noshow'?'selected':''}>Не прийшла</option>
        <option value="cancelled" ${fStatus==='cancelled'?'selected':''}>Скасовано</option>
      </select></div>
      <div class="field"><label>Оплачено (грн)</label><input type="number" class="fi" id="fm" value="${fPaid}"/></div>
      <div class="field"><label>Чайові (грн)</label><input type="number" class="fi" id="ftip" value="${fTips}" placeholder="0"/></div>
      <div class="field"><label>Примітка</label><textarea class="fi" id="fn">${fNote}</textarea></div>
      <div class="mf">
        ${a?`<button class="btn bd bs" id="fdel">Видалити</button>`:''}
        <button class="btn bg" id="fcancel">Скасувати</button>
        <button class="btn bp" id="fsave">Зберегти</button>
      </div>`;

    $('mx').onclick=closeDraft;$('fcancel').onclick=closeDraft;
    $('fc').addEventListener('change',()=>{
      const nm=$('fc').value.trim().toLowerCase();
      const c=buildClients().find(x=>x.name.toLowerCase()===nm);
      if(c&&c.phone&&!$('fp').value)$('fp').value=c.phone;
      if(c&&c.source&&$('fsrc')&&!$('fsrc').value)$('fsrc').value=c.source;
      renderRecipeBox();
    });
    $('fp').addEventListener('change',()=>renderRecipeBox());
    ['fform','fn','fm','ftip'].forEach(id=>{const el=$(id);if(el)el.addEventListener('input',()=>{captureFields();queueMaterialsAutosave();});});
    if($('fsrc'))$('fsrc').addEventListener('change',()=>{captureFields();queueMaterialsAutosave();});
    // Рецепт із минулого візиту: показати й за один дотик скопіювати матеріали в цей запис.
    function renderRecipeBox(idx){
      const box=$('recipeBox');if(!box)return;
      idx=idx||0;
      const prev=prevRecipes($('fc').value,$('fp').value,apptId||a?.id,a?((a.date||'')+(a.time||'')):null,3);
      if(!prev.length){box.innerHTML='';return;}
      const v=prev[Math.min(idx,prev.length-1)];
      box.innerHTML=`<div class="card" style="margin-bottom:13px;padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="sec" style="margin:0">🎨 Минулий рецепт</div><button class="btn bp bs" id="rcopy">Скопіювати</button></div>
        ${recipeHtml(v)}
        ${prev.length>1?`<select class="fi" id="rsel" style="margin-top:8px">${prev.map((x,i)=>`<option value="${i}" ${x===v?'selected':''}>${fmtS(x.date)}</option>`).join('')}</select>`:''}
      </div>`;
      $('rcopy').onclick=()=>{
        captureDur();
        if(v.formula&&!fFormula.trim())fFormula=v.formula; // формулу копіюємо лише в порожнє поле, щоб нічого не затерти
        recipeLines(v).forEach(l=>{const ex=selMats.find(x=>x.matId===l.matId);if(ex)ex.qty=l.qty;else selMats.push({matId:l.matId,qty:l.qty});});
        renderApptModal();
        queueMaterialsAutosave();
      };
      if($('rsel'))$('rsel').onchange=e=>renderRecipeBox(+e.target.value);
    }
    renderRecipeBox();
    // Jumps straight to this client's full visit history. Whatever isn't
    // saved yet in THIS form (paid amount, tips, note, status) is left
    // behind when we navigate away — materials are already safe via the
    // live draft-save, everything else waits for the actual Save button,
    // same as closing the modal any other way.
    $('chistlink').onclick=()=>{
      const name=($('fc').value||'').trim();
      if(!name){alert("Спочатку впишіть ім'я клієнтки");return;}
      clientHistoryModal(name);
    };
    // Reads whatever is currently sitting in the adj / material-qty inputs
    // back into selSvcs/selMats. Must run before any re-render (adding or
    // removing a service/material, or the duration selects triggering
    // captureFields), otherwise those in-progress edits get discarded.
    const captureLiveInputs=()=>{
      $('modal').querySelectorAll('[data-adj]').forEach(inp=>{if(selSvcs[+inp.dataset.adj])selSvcs[+inp.dataset.adj].adj=+inp.value||0;});
      $('modal').querySelectorAll('[data-matqty]').forEach(inp=>{if(selMats[+inp.dataset.matqty])selMats[+inp.dataset.matqty].qty=+inp.value||0;});
    };
    const captureDur=()=>{captureLiveInputs();captureFields();};
    $('fdh').onchange=()=>{captureDur();updateAllLiveDisplays();};
    $('fdm').onchange=()=>{captureDur();updateAllLiveDisplays();};
    $('fsadd').onchange=e=>{
      if(!e.target.value)return;
      captureDur();
      const svcId=e.target.value;
      selSvcs.push({serviceId:svcId,adj:0});
      // Auto-carry the service's standard "recipe" materials into this
      // appointment — this is exactly what lets shampoo/conditioner count
      // toward the margin without being typed in every single visit.
      // Existing lines for the same material get topped up rather than
      // duplicated (e.g. two services in one visit that both use the same
      // conditioner).
      const svc=svcs.find(sv=>sv.id===svcId);
      (svc?.defaultMaterials||[]).forEach(dm=>{
        const existing=selMats.find(sm=>sm.matId===dm.matId);
        if(existing)existing.qty=(existing.qty||0)+(dm.qty||0);
        else selMats.push({matId:dm.matId,qty:dm.qty||0});
      });
      e.target.value='';
      renderApptModal();
      queueMaterialsAutosave();
    };
    $('modal').querySelectorAll('[data-rmsvc]').forEach(b=>b.onclick=()=>{
      captureDur();
      selSvcs.splice(+b.dataset.rmsvc,1);
      renderApptModal();
      queueMaterialsAutosave();
    });
    function bindMatPickHandlers(){
      $('modal').querySelectorAll('[data-pickmat]').forEach(el2=>{
        el2.onclick=()=>{
          captureDur();
          selMats.push({matId:el2.dataset.pickmat,qty:0});
          matSearchQ='';
          renderApptModal();
          // No autosave call here on purpose — qty is still 0 right after
          // picking a material, and persistMaterialsLive() filters out
          // qty<=0 lines anyway, so it'd be a no-op write. The qty input
          // below triggers the actual save once a number is typed.
        };
      });
    }
    bindMatPickHandlers();
    $('fmsearch').addEventListener('input',e=>{
      $('matPickList').innerHTML=renderMatPickList(e.target.value);
      bindMatPickHandlers();
    });
    $('modal').querySelectorAll('[data-rmmat]').forEach(b=>b.onclick=()=>{
      captureDur();
      selMats.splice(+b.dataset.rmmat,1);
      renderApptModal();
      queueMaterialsAutosave();
    });
    // Single source of truth for every number that can change WITHOUT a full
    // re-render: the "Послуги N · сума · час" header, the "(змінено вручну)"
    // duration note, each material row's cost/over-limit warning, and the
    // materials-cost/margin card. Called on every discount, material qty,
    // and manual-duration edit, so nothing on screen goes stale until the
    // next add/remove.
    const fmtDurLive=d=>{const h=Math.floor(d/60),m=d%60;return(h>0?h+'г ':'')+(m>0?m+'хв':'');};
    function updateAllLiveDisplays(){
      const totalPrice2=selSvcs.reduce((s,ss)=>s+Math.max(0,(svcs.find(sv=>sv.id===ss.serviceId)?.price||0)+(ss.adj||0)),0);
      const totalDurMin2=selSvcs.reduce((s,ss)=>s+(svcs.find(sv=>sv.id===ss.serviceId)?.duration||60),0);
      const shownDur2=Math.min(durOverride!==null?durOverride:totalDurMin2,480);
      const hdr=$('svcHeaderInfo');
      if(hdr)hdr.textContent=selSvcs.length>0?`${selSvcs.length} · ${fmt(totalPrice2)} грн · ${fmtDurLive(shownDur2)}`:'';
      const note=$('durNote');
      if(note)note.textContent=(durOverride!==null&&durOverride!==totalDurMin2)?'(змінено вручну)':'';

      let totalMatCost2=0;
      selMats.forEach((sm,i)=>{
        const m=mats.find(x=>x.id===sm.matId);
        const{unit,ppu,availUnits}=matUnitInfo(m);
        const alreadyUsed=deductedMaterialsUsed.find(x=>x.matId===sm.matId);
        const effAvail=availUnits+(alreadyUsed?alreadyUsed.qty:0);
        const cost=(sm.qty||0)*ppu;
        totalMatCost2+=cost;
        const costEl=$('modal').querySelector(`[data-matcost="${i}"]`);
        if(costEl)costEl.textContent=cost.toFixed(2)+' грн';
        const over=sm.qty>effAvail;
        const warnEl=$('modal').querySelector(`[data-matwarn="${i}"]`);
        if(warnEl){warnEl.style.color=over?'var(--err)':'var(--dim)';warnEl.textContent=(over?'⚠️ Перевищує залишок — ':'')+'Доступно: '+effAvail.toFixed(1)+' '+unit;}
        const qtyInput=$('modal').querySelector(`[data-matqty="${i}"]`);
        if(qtyInput)qtyInput.style.borderColor=over?'var(--err)':'var(--brd)';
      });
      const mhdr=$('matHeaderInfo');
      if(mhdr)mhdr.textContent=selMats.length>0?`${selMats.length} · ${totalMatCost2.toFixed(2)} грн`:'';

      const margin2=totalPrice2-totalMatCost2, marginPct2=totalPrice2>0?(margin2/totalPrice2*100):0;
      const mc=$('fmatcosttxt'),mg=$('fmargintxt');
      if(mc)mc.textContent=totalMatCost2.toFixed(2)+' грн';
      if(mg){mg.textContent=fmt(margin2)+' грн ('+marginPct2.toFixed(0)+'%)';mg.style.color=margin2>=0?'var(--ok)':'var(--err)';}
    }
    $('modal').querySelectorAll('[data-adj]').forEach(inp=>inp.addEventListener('input',e=>{
      selSvcs[+inp.dataset.adj].adj=+e.target.value||0;
      updateAllLiveDisplays();
      queueMaterialsAutosave();
    }));
    $('modal').querySelectorAll('[data-matqty]').forEach(inp=>inp.addEventListener('input',e=>{
      selMats[+inp.dataset.matqty].qty=+e.target.value||0;
      updateAllLiveDisplays();
      queueMaterialsAutosave();
    }));
    $('fsave').onclick=async()=>{
      const client=$('fc').value;
      if(!client||selSvcs.length===0){alert("Заповніть ім'я та оберіть послугу");return;}
      // Read current adj + material qty values before saving
      $('modal').querySelectorAll('[data-adj]').forEach(inp=>{selSvcs[+inp.dataset.adj].adj=+inp.value||0;});
      $('modal').querySelectorAll('[data-matqty]').forEach(inp=>{selMats[+inp.dataset.matqty].qty=+inp.value||0;});
      const finalDuration=+$('fdh').value*60 + +$('fdm').value;
      const newStatus=$('fst').value;
      const apptDate=$('fd').value;
      const materialsUsedFinal=selMats.filter(sm=>sm.matId&&sm.qty>0).map(sm=>({matId:sm.matId,qty:sm.qty}));
      const materialCostFinal=materialsUsedFinal.reduce((s,sm)=>{const m=mats.find(x=>x.id===sm.matId);return s+sm.qty*matUnitInfo(m).ppu;},0);

      // Manual "Оплачено" amount, exactly as typed — no button, no auto
      // status changes. If left empty/0, analytics falls back to the full
      // service total (apptTotalPrice) for "Виконано" visits.
      const data={client,phone:$('fp').value,serviceId:selSvcs[0].serviceId,
        services:selSvcs.map(s=>({serviceId:s.serviceId,adj:s.adj||0})),
        date:apptDate,time:$('ft').value,status:newStatus,
        customDuration:finalDuration,
        materialsUsed:materialsUsedFinal,materialCost:materialCostFinal,
        paid:+$('fm').value||0,tips:+$('ftip').value||0,note:$('fn').value,formula:$('fform').value,source:$('fsrc').value,
        // Every save through this modal already logs material changes at
        // the moment they're actually deducted (see the delta loop below)
        // -- so this appointment never needs to go through the backfill
        // button in Історія. Without this flag, brand new appointments
        // would sit in that backfill queue forever (it was never set on
        // regular saves, only by the backfill button itself), and
        // re-running the backfill would duplicate what was already logged
        // -- exactly what caused the duplicate entries before.
        materialsHistoryBackfilled:true};

      // Stock is deducted (or returned) ONLY here, and ONLY based on
      // whether the appointment IS or WAS marked "Виконано" --
      // deductedMaterialsUsed is what's actually reflected in stock right
      // now; "effective new" is the full list if this save marks it done,
      // otherwise empty (nothing should be held against stock while it's
      // just "Очікує", no matter how many materials were typed in and
      // draft-saved along the way).
      const oldEffective=deductedMaterialsUsed;
      const newEffective=(newStatus==='done')?materialsUsedFinal:[];
      const matIds=[...new Set([...oldEffective.map(x=>x.matId),...newEffective.map(x=>x.matId)])];
      const writes=[];let isNewAppt=false;
      if(!apptId){apptId=doc(collection(db,'appointments')).id;isNewAppt=true;}
      for(const mid of matIds){
        const m=mats.find(x=>x.id===mid);if(!m)continue;
        const oldQ=oldEffective.find(x=>x.matId===mid)?.qty||0;
        const newQ=newEffective.find(x=>x.matId===mid)?.qty||0;
        const deltaUnits=newQ-oldQ;
        if(deltaUnits===0)continue;
        const deltaSht=unitsToSht(m,deltaUnits);
        // No Math.max(0, ...) clamp here on purpose: if a write-off happens
        // before its matching "Прихід" is entered (spend first, receive
        // later -- a normal real-world order), the stock temporarily goes
        // negative and self-corrects the moment the receive arrives. If we
        // floored it at 0 instead, the deduction would just be silently
        // lost and never recovered once new stock came in.
        writes.push(updateDoc(doc(db,'materials',mid),{qty:+((m.qty||0)-deltaSht).toFixed(4)}));
        // Log net-new consumption into the same purchases/history trail as
        // a manual "Списати" -- so material used via an appointment now
        // shows up in Історія операцій too, with the client's name as the
        // note. Only the increase is logged; reductions (e.g. un-marking
        // "Виконано" back to "Очікує") just quietly return stock.
        if(deltaUnits>0){
          const{unit,ppu}=matUnitInfo(m);
          writes.push(addDoc(collection(db,'purchases'),{matId:mid,matName:m.name,type:'spend',qty:deltaUnits,unit,total:deltaUnits*ppu,date:apptDate,note:client,apptId}));
        }
      }
      deductedMaterialsUsed=newEffective;
      data.materialsDeducted=newEffective;
      writes.push(isNewAppt?setDoc(doc(db,'appointments',apptId),data):updateDoc(doc(db,'appointments',apptId),data));
      savedFinal=true;
      if(matSaveTimer)clearTimeout(matSaveTimer);
      hide();
      bgWrites(writes,'appt-save');
    };
    if(a)$('fdel').onclick=async()=>{
      if(!confirm('Видалити?'))return;
      // Return materials to stock -- but only what's ACTUALLY still "out"
      // (deductedMaterialsUsed): if this appointment was never marked
      // "Виконано", nothing was deducted in the first place, so there's
      // nothing to return, no matter what's sitting in the materials
      // draft.
      const effective=deductedMaterialsUsed;const delWrites=[];
      for(const{matId,qty}of effective){
        const m=mats.find(x=>x.id===matId);if(!m)continue;
        const deltaSht=unitsToSht(m,qty);
        delWrites.push(updateDoc(doc(db,'materials',matId),{qty:+((m.qty||0)+deltaSht).toFixed(4)}));
      }
      savedFinal=true;delWrites.push(deleteDoc(doc(db,'appointments',a.id)));hide();bgWrites(delWrites,'appt-delete');
    };
  }
  show('');renderApptModal();
}

// Break / pause block — a lightweight non-client entry (lunch, consultation
// hold, etc). Stored in the same 'appointments' collection with isBreak:true
// so it reuses the existing drag/resize/rendering machinery for free, but is
// skipped everywhere client stats are computed (nothing sets a.status on it,
// and analytics only counts a.status==='done').
// Client directory — every unique client name pulled straight out of the
// appointments already in the app (no separate "clients" collection to
// keep in sync), with a running visit count and total spent, so you don't
// have to remember who's who or scroll the calendar to check.
function clientsListModalOld(){
  let cq='', sortMode='recent';
  function render(){
    // Group every non-cancelled, non-break appointment by client name.
    // "Візити" counts done + upcoming (pending) so the number matches what
    // the person intuitively expects to see; everything frequency/revenue
    // related below uses only completed (done) visits, since a scheduled
    // future appointment shouldn't yet count toward someone's history.
    const byClient={};
    appts.filter(a=>!a.isBreak&&a.client&&a.client.trim()&&a.status!=='cancelled').forEach(a=>{
      const key=a.client.trim().toLowerCase();
      if(!byClient[key])byClient[key]={name:a.client.trim(),phone:a.phone||'',visits:0,doneDates:[],totalPaid:0,lastDate:''};
      const c=byClient[key];
      c.visits+=1;
      if(!c.phone&&a.phone)c.phone=a.phone;
      if((a.date||'')>c.lastDate)c.lastDate=a.date||'';
      if(a.status==='done'){c.doneDates.push(a.date);c.totalPaid+=(a.paid||apptTotalPrice(a));}
    });
    const todayStr=today();
    const dayMs=86400000;
    let clients=Object.values(byClient).map(c=>{
      const dates=[...c.doneDates].sort();
      // Average gap between consecutive completed visits — "how often does
      // this person usually come back" — needs at least 2 visits to mean
      // anything.
      let avgGap=null;
      if(dates.length>=2){
        let sum=0;
        for(let i=1;i<dates.length;i++)sum+=(new Date(dates[i]+'T12:00:00')-new Date(dates[i-1]+'T12:00:00'))/dayMs;
        avgGap=sum/(dates.length-1);
      }
      const daysSince=c.lastDate?Math.round((new Date(todayStr+'T12:00:00')-new Date(c.lastDate+'T12:00:00'))/dayMs):null;
      // Flagged when overdue relative to their OWN usual rhythm (1.5x their
      // average gap), or — for someone with no established rhythm yet — a
      // flat 45-day fallback, whichever is more lenient, so a client who
      // visits every 3 weeks gets flagged sooner than one who visits twice
      // a year.
      const threshold=avgGap?Math.max(45,avgGap*1.5):45;
      const needsAttention=daysSince!==null&&daysSince>threshold;
      return{...c,avgGap,daysSince,needsAttention,doneVisits:dates.length,firstDate:dates[0]||null};
    });

    // Base-wide numbers — the actual "client base analytics" part.
    const totalClients=clients.length;
    const monthKey=todayStr.slice(0,7);
    const newThisMonth=clients.filter(c=>c.firstDate&&c.firstDate.slice(0,7)===monthKey).length;
    const returning=clients.filter(c=>c.doneVisits>=2).length;
    const retentionPct=totalClients?(returning/totalClients*100):0;
    const gaps=clients.filter(c=>c.avgGap!=null).map(c=>c.avgGap);
    const avgFreq=gaps.length?gaps.reduce((s,g)=>s+g,0)/gaps.length:null;
    const totalDoneVisits=clients.reduce((s,c)=>s+c.doneVisits,0);
    const totalRevenue=clients.reduce((s,c)=>s+c.totalPaid,0);

      if(sortMode==='visits')return b.visits-a.visits;

    const rows=list.map(c=>`

          <div class="rs">${c.visits} візит${c.visits===1?'':(c.visits>=2&&c.visits<=4)?'и':'ів'}${c.phone?' · '+c.phone:''}</div>
          <div class="rs">${c.lastDate?'останній '+fmtS(c.lastDate)+(c.daysSince!=null?' · '+c.daysSince+' дн. тому':''):'ще не було візитів'}${c.avgGap?' · зазвичай раз на '+Math.round(c.avgGap)+' дн.':''}</div>
        </div>
        <div class="rr"><div class="rv">${fmt(c.totalPaid)} грн</div></div>

    $('modal').innerHTML=`
      <div class="mh"><div class="mt">👤 Клієнти</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>

        <div class="sc"><div class="sv" style="color:var(--acs)">${newThisMonth}</div><div class="sl">Нових цього місяця</div></div>
        <div class="sc"><div class="sv" style="color:var(--ok)">${retentionPct.toFixed(0)}%</div><div class="sl">Повертаються (2+ візити)</div></div>
        <div class="sc"><div class="sv" style="color:var(--sil)">${avgFreq?Math.round(avgFreq)+' дн.':'—'}</div><div class="sl">Сер. частота повернень</div></div>
        <div class="sc"><div class="sv" style="color:var(--sil)">${fmt(avgCheckAll)} грн</div><div class="sl">Сер. чек по базі</div></div>
        <div class="sc" style="${attentionCount>0?'cursor:pointer':''}" id="cardAttention"><div class="sv" style="color:${attentionCount>0?'var(--err)':'var(--mut)'}">${attentionCount}</div><div class="sl">⏰ Давно не були</div></div>
      </div>
      <input class="fi" id="cq" style="margin-bottom:10px" placeholder="🔍 Пошук за ім'ям чи телефоном..." value="${cq}"/>
      <div class="chips">${[['recent','Останні'],['visits','За візитами'],['spend','За сумою'],['attention','⏰ Потребують уваги']].map(([k,l])=>`<button class="chip ${sortMode===k?'on':''}" data-sort="${k}">${l}</button>`).join('')}</div>
      ${list.length===0?'<div class="empty">Клієнтів не знайдено</div>':rows}`;
    $('mx').onclick=hide;
    $('cq').addEventListener('input',e=>{
      cq=e.target.value;render();
      setTimeout(()=>{const el2=$('cq');if(el2){el2.focus();el2.setSelectionRange(el2.value.length,el2.value.length);}},10);
    });
    $('modal').querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;render();});
    if($('cardAttention'))$('cardAttention').onclick=()=>{if(attentionCount>0){sortMode='attention';render();}};
    $('modal').querySelectorAll('[data-client]').forEach(el2=>el2.onclick=()=>clientHistoryModal(el2.dataset.client));
  }
  show('');render();
}

  const key=clientName.trim().toLowerCase();
  const visits=appts.filter(a=>!a.isBreak&&(a.client||'').trim().toLowerCase()===key)
    .sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
  const doneVisits=visits.filter(a=>a.status==='done');

  const totalTips=doneVisits.reduce((s,a)=>s+(a.tips||0),0);
  const avgCheck=doneVisits.length?totalPaid/doneVisits.length:0;
  const phone=visits.find(a=>a.phone)?.phone||'';
  const rows=visits.map(a=>{
    const svcNames=a.services?a.services.map(s=>{const sid=typeof s==='object'?s.serviceId:s;return svcs.find(sv=>sv.id===sid)?.name||'';}).filter(Boolean).join('+'):(svcs.find(sv=>sv.id===a.serviceId)?.name||'');
    const amt=a.paid||apptTotalPrice(a);

      <div class="rr"><div class="rv">${a.status==='cancelled'?'—':fmt(amt)+' грн'}</div>${a.materialCost?`<div class="ra">матер. ${fmt(a.materialCost)} грн</div>`:''}</div>
    </div>`;
  }).join('');
  show(`<div class="mh"><div class="mt">${clientName.trim()}</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
    ${phone?`<div style="font-size:12px;color:var(--mut);margin-bottom:10px">📞 ${phone}</div>`:''}
    <div class="sg" style="margin-bottom:14px">
      <div class="sc"><div class="sv" style="color:var(--sil)">${visits.length}</div><div class="sl">Візитів</div></div>
      <div class="sc"><div class="sv" style="color:var(--acs)">${fmt(totalPaid)} грн</div><div class="sl">Разом сплачено</div></div>
      <div class="sc"><div class="sv" style="color:var(--sil)">${fmt(avgCheck)} грн</div><div class="sl">Сер. чек</div></div>
      <div class="sc"><div class="sv" style="color:var(--ok)">${fmt(totalTips)} грн</div><div class="sl">Чайові</div></div>
    </div>
    ${visits.length===0?'<div class="empty">Візитів не знайдено</div>':rows}`);
  $('mx').onclick=hide;
  $('modal').querySelectorAll('[data-appt]').forEach(el2=>el2.onclick=()=>{
    const a=appts.find(x=>x.id===el2.dataset.appt);
    if(a)apptModal(a,a.date,a.time);
  });
}

// ══════════════ KPI: завантаження, скасування, повернення, динаміка, ціль, джерела ══════════════
const SOURCES=['Instagram','Рекомендація','Реклама','Google/карти','Інше'];
const apptRev=a=>(a.paid||apptTotalPrice(a));
let _notRet=[];
function kpiStatsHtml(){
  const t=today(),now=new Date();
  let from,to=t;
  if(period==='day')from=t;
  else if(period==='week')from=addDays(t,-6);
  else if(period==='month')from=t.slice(0,8)+'01';
  else if(period==='year')from=t.slice(0,4)+'-01-01';
  else{from=periodFrom||t;to=periodTo||t;}
  const toFact=to<t?to:t;                       // «факт» — лише до сьогодні
  const hrs=m=>(m/60).toFixed(1).replace(/\.0$/,'');
  const pc=v=>v==null?'—':Math.round(v)+'%';
  const diffDays=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
  const real=appts.filter(a=>!a.isBreak&&a.date&&a.client);
  const dates=[];for(let d=from,g=0;d<=toFact&&g<800;d=addDays(d,1),g++)dates.push(d);
  const stat=(v,l,c)=>`<div class="sc"><div class="sv" style="color:${c||'var(--sil)'}">${v}</div><div class="sl">${l}</div></div>`;

  // 1) Завантаження та виручка за годину
  const inFact=real.filter(a=>a.date>=from&&a.date<=toFact);
  // Інтервали записів рахуємо ПО ЧАСУ: обрізаємо до робочого вікна дня й зливаємо накладені, тому
  // «виконано» ніколи не перевищує «записи». Усе поза графіком (вихідні, години до/після) виносимо окремо.
  const toIv=a=>{const hm=a.time.split(':');const st=(+hm[0])*60+(+hm[1]||0);return[st,st+apptDuration(a)];};
  const unionIn=(ivs,w0,w1)=>{
    const arr=ivs.map(([a0,a1])=>w0==null?[a0,a1]:[Math.max(a0,w0),Math.min(a1,w1)]).filter(([a0,a1])=>a1>a0).sort((x,y)=>x[0]-y[0]);
    let tot=0,cs=null,ce=null;
    arr.forEach(([a0,a1])=>{if(cs==null){cs=a0;ce=a1;}else if(a0<=ce){ce=Math.max(ce,a1);}else{tot+=ce-cs;cs=a0;ce=a1;}});
    if(cs!=null)tot+=ce-cs;
    return tot;
  };
  const ivByDate=list=>{const o={};list.filter(a=>a.time).forEach(a=>{(o[a.date]||(o[a.date]=[])).push(toIv(a));});return o;};
  const doneF=inFact.filter(a=>a.status==='done');
  const busyIv=ivByDate(inFact.filter(a=>a.status!=='cancelled')),doneIv=ivByDate(doneF);
  let workMins=0,busyMins=0,doneIn=0,doneAll=0,busyAll=0;
  dates.forEach(d=>{
    const w=getWorkMins(d);workMins+=w;
    if(w>0){const dh=getDayHours(d);busyMins+=unionIn(busyIv[d]||[],dh.start*60,dh.end*60);doneIn+=unionIn(doneIv[d]||[],dh.start*60,dh.end*60);}
    busyAll+=unionIn(busyIv[d]||[],null,null);doneAll+=unionIn(doneIv[d]||[],null,null);
  });
  const overMins=Math.max(0,busyAll-busyMins);
  const doneMins=doneAll;
  const revF=doneF.reduce((s,a)=>s+apptRev(a),0);
  const loadPct=workMins?busyMins/workMins*100:null;
  const donePct=workMins?doneIn/workMins*100:null;
  const perWork=workMins?revF/(workMins/60):0, perDone=doneMins?revF/(doneMins/60):0;
  const freeMins=Math.max(0,workMins-busyMins), lostIdle=freeMins/60*perDone;
  const loadColor=loadPct==null?'var(--mut)':loadPct>=70?'var(--ok)':loadPct>=40?'var(--wrn)':'var(--err)';
  const loadCard=`<div class="card"><div class="sec" style="margin-top:0">📈 Завантаження та ефективність</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:8px">${dates.length?fmtS(from)+' – '+fmtS(toFact):'період ще не настав'} · робочих годин: ${hrs(workMins)}</div>
    <div class="sg" style="margin-bottom:8px">
      ${stat(pc(loadPct),'Завантаження (записи)',loadColor)}${stat(pc(donePct),'Відпрацьовано (виконано)','var(--acs)')}
      ${stat(fmt(perWork)+' грн','Виручка за робочу годину')}${stat(fmt(perDone)+' грн','Виручка за годину роботи')}
    </div>
    <div style="font-size:12px;color:var(--mut)">Вільно: <b style="color:var(--sil)">${hrs(freeMins)} год</b>${perDone>0?` · ≈ недоотримано <b style="color:var(--wrn)">${fmt(lostIdle)} грн</b> (за вашою ставкою за годину)`:''}</div>${overMins>0?`<div style="font-size:11px;color:var(--dim);margin-top:6px">Понад графік: ${hrs(overMins)} год — записи у вихідні або поза робочими годинами. У завантаження не входять, у виручку входять.</div>`:''}</div>`;

  // 2) Скасування та неявки (за весь період, включно з майбутніми датами)
  const inFull=real.filter(a=>a.date>=from&&a.date<=to);
  const cDone=inFull.filter(a=>a.status==='done').length,cNo=inFull.filter(a=>a.status==='noshow').length,cCan=inFull.filter(a=>a.status==='cancelled').length;
  const resolved=cDone+cNo+cCan;
  const lostRev=inFull.filter(a=>a.status==='noshow'||a.status==='cancelled').reduce((s,a)=>s+apptTotalPrice(a),0);
  const unmarked=real.filter(a=>(a.status==='pending'||a.status==='confirmed'||!a.status)&&a.date<t).length;
  const cancelCard=`<div class="card"><div class="sec" style="margin-top:0">🚫 Скасування та неявки</div>
    <div class="sg" style="margin-bottom:8px">
      ${stat(resolved?pc(cNo/resolved*100):'—','Не прийшли ('+cNo+')',cNo?'var(--wrn)':'var(--mut)')}${stat(resolved?pc(cCan/resolved*100):'—','Скасовано ('+cCan+')',cCan?'var(--err)':'var(--mut)')}
    </div>
    <div style="font-size:12px;color:var(--mut)">Втрачена виручка (за вартістю послуг): <b style="color:var(--err)">${fmt(lostRev)} грн</b> · рахується від ${resolved} завершених записів</div>
    ${unmarked?`<div style="font-size:11px;color:var(--wrn);margin-top:6px">⚠️ ${unmarked} минулих записів без статусу — відмітьте їх, інакше вони не потрапляють у виручку й показники.</div>`:''}</div>`;

  // 3) Повернення клієнток 30/60/90 днів
  const cl=buildClients();
  const ret={30:{e:0,r:0},60:{e:0,r:0},90:{e:0,r:0}};
  const notRet=[];
  cl.forEach(c=>{
    const ds=[...new Set(c.all.filter(a=>a.status==='done').map(a=>a.date))].sort();
    ds.forEach((d,i)=>{
      if(d<from||d>toFact)return;
      const age=diffDays(d,t),next=ds[i+1];
      [30,60,90].forEach(N=>{if(age>=N){ret[N].e++;if(next&&diffDays(d,next)<=N)ret[N].r++;}});
      if(age>=90&&!(next&&diffDays(d,next)<=90))notRet.push({c,d});
    });
  });
  _notRet=notRet;
  const rr=N=>ret[N].e?ret[N].r/ret[N].e*100:null;
  const retCard=`<div class="card"><div class="sec" style="margin-top:0">🔁 Повернення клієнток</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:8px">Яка частка візитів періоду завершилась новим візитом протягом N днів. Враховуються лише візити, для яких цей строк уже минув.</div>
    <div class="sg" style="grid-template-columns:repeat(3,1fr);margin-bottom:0">
      ${[30,60,90].map(N=>stat(pc(rr(N)),'за '+N+' дн.'+(ret[N].e?' (з '+ret[N].e+')':''),rr(N)==null?'var(--mut)':rr(N)>=50?'var(--ok)':rr(N)>=30?'var(--wrn)':'var(--err)')).join('')}
    </div>${ret[90].e?`<button class="btn bg bs" id="retDetail" style="margin-top:10px;width:100%;justify-content:center">Хто не повернулась за 90 днів (${notRet.length})</button>`:''}</div>`;

  // 4) Ціль місяця і прогноз
  const ym=t.slice(0,7),goal=+(localStorage.getItem('goal')||0);
  const monthDone=appts.filter(a=>a.status==='done'&&(a.date||'').slice(0,7)===ym).reduce((s,a)=>s+apptRev(a),0);
  const planned=appts.filter(a=>!a.isBreak&&(a.status==='pending'||a.status==='confirmed')&&a.date>=t&&a.date.slice(0,7)===ym).reduce((s,a)=>s+apptTotalPrice(a),0);
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  let elapsedW=0,totalW=0,remainW=0;
  for(let i=1;i<=dim;i++){const d=ym+'-'+String(i).padStart(2,'0');if(!isWorkDay(d))continue;totalW++;if(d<=t)elapsedW++;if(d>=t)remainW++;}
  const pace=elapsedW?monthDone/elapsedW*totalW:0;
  const byBook=monthDone+planned;
  const need=Math.max(0,goal-monthDone);
  const goalCard=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="sec" style="margin:0">🎯 Ціль місяця</div><button class="btn bg bs" id="setGoal">${goal>0?'Змінити':'Задати ціль'}</button></div>
    <div style="font-size:12px;color:var(--mut);margin:8px 0 4px">Отримано: <b style="color:var(--ok)">${fmt(monthDone)} грн</b> · заплановано записами: <b style="color:var(--wrn)">${fmt(planned)} грн</b></div>
    ${goal>0?`<div class="pb" style="height:8px"><div class="pf" style="width:${Math.min(100,monthDone/goal*100)}%"></div></div>
      <div style="font-size:12px;color:var(--mut);margin-top:6px">Ціль ${fmt(goal)} грн · виконано ${pc(monthDone/goal*100)}${need>0?` · лишилось ${fmt(need)} грн${remainW?` (≈ ${fmt(need/remainW)} грн на робочий день, днів: ${remainW})`:''}`:' · ціль досягнуто 🎉'}</div>`:''}
    <div style="font-size:12px;color:var(--mut);margin-top:8px">Прогноз за записами: <b style="color:var(--sil)">${fmt(byBook)} грн</b> · за темпом: <b style="color:var(--sil)">${fmt(pace)} грн</b>${goal>0?` ${byBook>=goal?'✅':'⚠️'}`:''}</div>
    <div style="font-size:10px;color:var(--dim);margin-top:4px">Темп = виручка за відпрацьовані робочі дні, перенесена на всі робочі дні місяця (${elapsedW} з ${totalW}).</div></div>`;

  // 5) Динаміка за 6 місяців
  const months=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');});
  const ms=months.map(m=>{const l=appts.filter(a=>a.status==='done'&&(a.date||'').slice(0,7)===m);const rev=l.reduce((s,a)=>s+apptRev(a),0);return{m,rev,n:l.length,avg:l.length?rev/l.length:0};});
  const maxM=Math.max(...ms.map(x=>x.rev),1);
  const prevYm=ms[4].m,dayNow=t.slice(8);
  const prevSame=appts.filter(a=>a.status==='done'&&(a.date||'').slice(0,7)===prevYm&&a.date.slice(8)<=dayNow).reduce((s,a)=>s+apptRev(a),0);
  const mom=prevSame>0?(monthDone-prevSame)/prevSame*100:null;

        <div style="font-size:9px;color:var(--dim)">${x.rev>0?(x.rev/1000).toFixed(1).replace(/\.0$/,'')+'к':''}</div>
        <div style="width:100%;border-radius:3px 3px 0 0;height:${Math.max(x.rev/maxM*70,x.rev>0?3:2)}px;background:${i===5?'linear-gradient(to top,#6B6380,#A89BC2)':'var(--brd)'}"></div>
        <div style="font-size:10px;color:var(--mut)">${new Date(x.m+'-01T12:00:00').toLocaleDateString('uk-UA',{month:'short'})}</div></div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--mut);margin-top:10px">Цей місяць до ${+dayNow}-го числа: <b style="color:var(--sil)">${fmt(monthDone)} грн</b> проти ${fmt(prevSame)} грн <span style="color:var(--dim)">у минулому місяці до тієї ж дати</span> ${mom==null?'':`<b style="color:${mom>=0?'var(--ok)':'var(--err)'}">${mom>=0?'+':''}${Math.round(mom)}%</b>`}</div>
    <div style="font-size:11px;color:var(--dim);margin-top:4px">Візитів / сер. чек: ${ms.map(x=>x.n+' / '+fmt(x.avg)).join(' · ')}</div></div>`;

  // 6) Джерела клієнток (за весь час)
  const srcAgg={};
  cl.forEach(c=>{const k=c.source||'Не вказано';const o=srcAgg[k]||(srcAgg[k]={name:k,clients:0,rev:0,visits:0,ret:0});o.clients++;o.rev+=c.totalPaid;o.visits+=c.doneCount;if(c.doneVisits>=2)o.ret++;});
  const srcRows=Object.values(srcAgg).sort((a,b)=>b.rev-a.rev);

// ── Рецепти фарбування з минулих візитів ──
const RECIPE_CATS=['Фарби','Окислювачі','Порошки'];
const escH=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const normName=n=>(n||'').trim().toLowerCase().replace(/\s+/g,' ');
const fmtQty=q=>Number.isInteger(q)?q:+Number(q).toFixed(1);
// Рецепт = матеріали, фактично вказані в записі (materialsUsed). Фарби, окислювачі й порошки — зверху.
function recipeLines(a){
  return (a.materialsUsed||[]).filter(u=>u.matId&&u.qty>0).map(u=>{
    const m=mats.find(x=>x.id===u.matId);
    return{matId:u.matId,qty:u.qty,name:m?.name||'(видалений матеріал)',unit:m?matUnitInfo(m).unit:'шт',cat:m?.category||''};
  }).sort((x,y)=>{const ix=RECIPE_CATS.indexOf(x.cat),iy=RECIPE_CATS.indexOf(y.cat);return (ix<0?9:ix)-(iy<0?9:iy);});
}
// Попередні візити клієнтки з непорожнім рецептом, найновіші першими. beforeKey = 'дата+час' запису,
// щоб для старого запису показувати лише те, що було ДО нього.
function prevRecipes(name,phone,excludeId,beforeKey,limit){
  const ck=normContact(phone),nm=normName(name);
  const c=buildClients().find(x=>(excludeId&&x.all.some(a=>a.id===excludeId))||(ck&&x.key===ck)||x.all.some(a=>normName(a.client)===nm));
  if(!c)return[];
  return c.all.filter(a=>a.id!==excludeId&&a.status!=='cancelled'&&a.status!=='noshow'&&(recipeLines(a).length>0||(a.formula||'').trim())&&(!beforeKey||((a.date||'')+(a.time||''))<beforeKey))
    .sort((x,y)=>((y.date||'')+(y.time||'')).localeCompare((x.date||'')+(x.time||''))).slice(0,limit||3);
}
function recipeHtml(v){
  const svcNames=apptSvcIds(v).map(id=>svcs.find(sv=>sv.id===id)?.name||'').filter(Boolean).join('+');
  return`<div style="font-size:11px;color:var(--mut);margin-bottom:4px">${fmtS(v.date)}${svcNames?' · '+svcNames:''}</div>`
    +(v.formula?`<div style="background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap;margin-bottom:6px">${escH(v.formula)}</div>`:'')
    +recipeLines(v).map(l=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0"><span>${l.name}</span><b style="color:var(--sil);white-space:nowrap">${fmtQty(l.qty)} ${l.unit}</b></div>`).join('')
    +(v.note?`<div style="font-size:11px;color:var(--dim);margin-top:4px">Примітка: ${v.note}</div>`:'');
}
const recipeShort=a=>{const l=recipeLines(a),f=(a.formula||'').trim();return (l.length||f)?`<div class="rs">🎨 ${f?escH(f)+(l.length?' · ':''):''}${l.map(x=>x.name+' '+fmtQty(x.qty)+x.unit).join(' · ')}</div>`:'';};

// ── Швидка зміна статусу прямо з календаря ──
// Повторює ту саму логіку складу, що й збереження в apptModal: матеріали списуються лише коли статус
// стає «Виконано», і повертаються, якщо запис із «Виконано» переведено в інший статус.
// Повертає масив записів (проміс-ів) — інтерфейс їх не чекає, див. bgWrites.
function quickSetStatus(a,newStatus,extra){
  if(a.status===newStatus&&!extra)return[];
  const writes=[];
  const oldEff=Array.isArray(a.materialsDeducted)?a.materialsDeducted:(a.status!=='cancelled'?(a.materialsUsed||[]):[]);
  const newEff=(newStatus==='done')?(a.materialsUsed||[]).filter(m=>m.matId&&m.qty>0).map(m=>({matId:m.matId,qty:m.qty})):[];
  const ids=[...new Set([...oldEff.map(x=>x.matId),...newEff.map(x=>x.matId)])];
  for(const mid of ids){
    const m=mats.find(x=>x.id===mid);if(!m)continue;
    const oldQ=oldEff.find(x=>x.matId===mid)?.qty||0,newQ=newEff.find(x=>x.matId===mid)?.qty||0;
    const deltaUnits=newQ-oldQ;
    if(deltaUnits===0)continue;
    writes.push(updateDoc(doc(db,'materials',mid),{qty:+((m.qty||0)-unitsToSht(m,deltaUnits)).toFixed(4)}));
    if(deltaUnits>0){
      const{unit,ppu}=matUnitInfo(m);
      writes.push(addDoc(collection(db,'purchases'),{matId:mid,matName:m.name,type:'spend',qty:deltaUnits,unit,total:deltaUnits*ppu,date:a.date,note:a.client,apptId:a.id}));
    }
  }
  writes.push(updateDoc(doc(db,'appointments',a.id),{status:newStatus,materialsDeducted:newEff,...(extra||{})}));
  return writes;
}

            <input type="number" value="${it.price}" style="width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:6px;color:var(--txt);font-size:13px;outline:none" data-price="${idx}"/></div>
          <div><div style="font-size:10px;color:var(--mut);margin-bottom:3px">Знижка %</div>
            <input type="number" value="${it.disc||0}" min="0" max="100" style="width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:6px;color:var(--txt);font-size:13px;outline:none" data-disc="${idx}"/></div>
        </div>
        <div style="font-size:11px;color:var(--mut);margin-top:6px" data-sum="${idx}">${(it.qty*dp).toFixed(2)} грн (ціна зі знижкою: ${dp.toFixed(2)} грн/шт)</div>
      </div>`;
    }).join('');
    const total=rcvItems.reduce((s,it)=>s+it.qty*(it.price||0)*(1-(it.disc||0)/100),0);
    const listHtml=fil2.map(m=>`<div style="padding:10px 14px;border-bottom:1px solid var(--brd);cursor:pointer;display:flex;justify-content:space-between" data-add="${m.id}">
      <span style="font-size:13px">${m.name}</span>
      <span style="font-size:12px;color:var(--mut)">${m.qty} шт</span>
    </div>`).join('');

    const prevSearch=searchVal;
    $('modal').innerHTML=`
      <div class="mh"><div class="mt">📦 Прихід товару${draftId||curDraftId?' (чернетка)':''}</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
      <div class="field"><label>Дата</label><input type="date" class="fi" id="rdate" value="${rDate}"/></div>
      <div class="field"><label>Примітка</label><input class="fi" id="rnote" placeholder="Постачальник..." value="${rNote}"/></div>
      ${rcvItems.length?`<div style="margin-bottom:10px">${itemsHtml}<div style="text-align:right;font-weight:700;font-size:14px;color:var(--sil)" data-grandtotal>Загалом: ${total.toFixed(2)} грн</div></div>`:''}
      <div style="font-size:12px;color:var(--mut);margin-bottom:6px">Оберіть товари:</div>
      <input class="fi" id="rsearch" style="margin-bottom:8px" placeholder="🔍 Пошук..." value="${prevSearch}"/>
      <div style="max-height:180px;overflow-y:auto;border:1px solid var(--brd);border-radius:8px;margin-bottom:14px">${listHtml||'<div style="padding:14px;color:var(--dim);text-align:center">Нічого не знайдено</div>'}</div>
      <div class="mf">
        <button class="btn bg" id="rcancel">Скасувати</button>
        <button class="btn bg" id="rdraft">📝 Чернетка</button>
        <button class="btn bp" id="rsave">Оприбуткувати (${rcvItems.length})</button>
      </div>`;

    $('mx').onclick=hide;$('rcancel').onclick=hide;
    const captureHeader=()=>{if($('rdate'))rDate=$('rdate').value;if($('rnote'))rNote=$('rnote').value;};
    $('rdate').addEventListener('change',captureHeader);
    $('rnote').addEventListener('input',captureHeader);
    // Search WITHOUT re-rendering whole modal — just update list
    $('rsearch').addEventListener('input',e=>{
      const v=e.target.value;
      const fil3=mats.filter(m=>!v||m.name.toLowerCase().includes(v.toLowerCase()));
      document.querySelector('#modal [style*="max-height:180px"]').innerHTML=
        fil3.map(m=>`<div style="padding:10px 14px;border-bottom:1px solid var(--brd);cursor:pointer;display:flex;justify-content:space-between" data-add="${m.id}">
          <span style="font-size:13px">${m.name}</span><span style="font-size:12px;color:var(--mut)">${m.qty} шт</span>
        </div>`).join('') || '<div style="padding:14px;color:var(--dim);text-align:center">Нічого не знайдено</div>';
      bindAddBtns();
    });
    // Don't auto-focus search to avoid keyboard issues
    function bindAddBtns(){
      $('modal').querySelectorAll('[data-add]').forEach(el2=>{
        el2.onclick=()=>{
          captureHeader();
          const m=mats.find(x=>x.id===el2.dataset.add);
          rcvItems.push({matId:el2.dataset.add,qty:1,price:m?.price||0,disc:0});
          render($('rsearch').value);
        };
      });
    }
    bindAddBtns();
    $('modal').querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{captureHeader();rcvItems.splice(+b.dataset.rem,1);render($('rsearch')?.value||'');});
    function updateItemSum(idx){
      const it=rcvItems[idx];
      const dp2=(it.price||0)*(1-(it.disc||0)/100);
      const sumEl=$('modal').querySelector(`[data-sum="${idx}"]`);
      if(sumEl)sumEl.textContent=(it.qty*dp2).toFixed(2)+' грн (ціна зі знижкою: '+dp2.toFixed(2)+' грн/шт)';
      // Update grand total
      const total2=rcvItems.reduce((s,x)=>s+x.qty*(x.price||0)*(1-(x.disc||0)/100),0);
      const totalEl=$('modal').querySelector('[data-grandtotal]');
      if(totalEl)totalEl.textContent='Загалом: '+total2.toFixed(2)+' грн';
    }
    $('modal').querySelectorAll('[data-qty]').forEach(inp=>inp.addEventListener('input',()=>{rcvItems[+inp.dataset.qty].qty=+inp.value||0;updateItemSum(+inp.dataset.qty);}));
    $('modal').querySelectorAll('[data-price]').forEach(inp=>inp.addEventListener('input',()=>{rcvItems[+inp.dataset.price].price=+inp.value||0;updateItemSum(+inp.dataset.price);}));
    $('modal').querySelectorAll('[data-disc]').forEach(inp=>inp.addEventListener('input',()=>{rcvItems[+inp.dataset.disc].disc=+inp.value||0;updateItemSum(+inp.dataset.disc);}));
    $('rdraft').onclick=async()=>{
      captureHeader();
      if(rcvItems.length===0){alert('Додайте хоча б один товар, щоб зберегти чернетку');return;}
      const draftData={date:rDate,note:rNote,items:rcvItems,updatedAt:new Date().toISOString()};
      if(curDraftId)bgWrites([updateDoc(doc(db,'drafts',curDraftId),draftData)],'draft');
      else{curDraftId=doc(collection(db,'drafts')).id;bgWrites([setDoc(doc(db,'drafts',curDraftId),draftData)],'draft');}
      hide();
    };
    $('rsave').onclick=async()=>{
      captureHeader();
      if(rcvItems.length===0){alert('Додайте товари');return;}
      const date=rDate,note=rNote;
      // One shared id per "накладна" (invoice) — every item entered together
      // in this session carries it, so history can group them back into one
      // invoice card instead of one row per unit.
      const batchId='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      const ws=[],live={};
      for(const it of rcvItems){
        const m=mats.find(x=>x.id===it.matId);if(!m)continue;
        const dp=(it.price||0)*(1-(it.disc||0)/100);
        // Один товар може бути в накладній двічі — рахуємо від проміжного стану, а не від застарілого m.qty.
        const st=live[it.matId]||{qty:m.qty||0,avg:m.avgPrice||m.price||dp};
        const newQ=st.qty+it.qty,newAvg=(st.qty*st.avg+it.qty*dp)/newQ,newPPU=m.volPerUnit>0?newAvg/m.volPerUnit:0;
        live[it.matId]={qty:newQ,avg:newAvg};
        ws.push(updateDoc(doc(db,'materials',it.matId),{qty:newQ,avgPrice:newAvg,avgPricePerUnit:newPPU}));
        ws.push(addDoc(collection(db,'purchases'),{matId:it.matId,matName:m.name,type:'receive',qty:it.qty,unit:'шт',price:dp,origPrice:it.price,disc:it.disc||0,total:it.qty*dp,date,note,batchId}));
      }
      if(curDraftId)ws.push(deleteDoc(doc(db,'drafts',curDraftId)));
      hide();bgWrites(ws,'receive');
    };
  }
  show('');render();
}

// Sale Modal — retail sale of goods to a client, separate from material
// spent on a service. Multi-item cart (same shape as the Прихід modal):
// pick a material, set qty + sale price per item (defaults to the
// material's saved retail price, falling back to its cost so nothing is
// ever blank), see cost/margin live, then confirm. Stock is deducted in
// шт just like a manual "Списати", and every item is logged into the same
// 'purchases' history collection with type:'sale' so Історія та Аналітика
// can pick it up without needing a separate collection or listener.
let saleItems=[];
function saleModal(){
  saleItems=[];
  let sDate=today(), sClient='';
  function render(searchVal=''){
    const fil2=mats.filter(m=>!searchVal||m.name.toLowerCase().includes(searchVal.toLowerCase()));
    const itemsHtml=saleItems.map((it,idx)=>{
      const m=mats.find(x=>x.id===it.matId);
      const cost=m?.avgPrice||m?.price||0;
      const lineSell=it.qty*(it.price||0),lineCost=it.qty*cost,margin=lineSell-lineCost;
      return`<div style="background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:10px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:13px;font-weight:600">${m?.name||'?'}</span>
          <button class="bi bs" data-rem="${idx}">${svg(ic.x,12,'var(--err)')}</button>
        </div>
        <div class="g2">
          <div><div style="font-size:10px;color:var(--mut);margin-bottom:3px">К-сть (шт)</div>
            <input type="number" step="1" min="0" value="${it.qty}" style="width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:6px;color:var(--txt);font-size:13px;outline:none" data-qty="${idx}"/></div>
          <div><div style="font-size:10px;color:var(--mut);margin-bottom:3px">Ціна продажу (грн/шт)</div>
            <input type="number" step="0.01" value="${it.price}" style="width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:6px;color:var(--txt);font-size:13px;outline:none" data-price="${idx}"/></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px" data-sum="${idx}">
          <span>Собівартість: ${lineCost.toFixed(2)} грн</span>
          <span style="color:${margin>=0?'var(--ok)':'var(--err)'};font-weight:600">Маржа: ${margin.toFixed(2)} грн</span>
        </div>
      </div>`;
    }).join('');
    const totalSell=saleItems.reduce((s,it)=>s+it.qty*(it.price||0),0);
    const totalCost=saleItems.reduce((s,it)=>{const m=mats.find(x=>x.id===it.matId);return s+it.qty*(m?.avgPrice||m?.price||0);},0);
    const totalMargin=totalSell-totalCost;
    const listHtml=fil2.map(m=>`<div style="padding:10px 14px;border-bottom:1px solid var(--brd);cursor:pointer;display:flex;justify-content:space-between" data-add="${m.id}">
      <span style="font-size:13px">${m.name}</span>
      <span style="font-size:12px;color:var(--mut)">${m.qty} шт</span>
    </div>`).join('');

    const prevSearch=searchVal;
    $('modal').innerHTML=`
      <div class="mh"><div class="mt">🛍️ Продаж товару</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
      <div class="field"><label>Дата</label><input type="date" class="fi" id="sdate2" value="${sDate}"/></div>
      <div class="field"><label>Клієнт</label><input class="fi" id="sclient" placeholder="Ім'я клієнта..." value="${sClient}"/></div>
      ${saleItems.length?`<div style="margin-bottom:10px">${itemsHtml}
        <div style="text-align:right;font-size:11px;color:var(--mut);margin-top:2px">Собівартість разом: ${totalCost.toFixed(2)} грн</div>
        <div style="text-align:right;font-weight:700;font-size:14px;color:var(--sil)" data-grandtotal>Разом продаж: ${totalSell.toFixed(2)} грн</div>
        <div style="text-align:right;font-size:12px;font-weight:600;color:${totalMargin>=0?'var(--ok)':'var(--err)'}" data-grandmargin>Маржа: ${totalMargin.toFixed(2)} грн</div>
      </div>`:''}
      <div style="font-size:12px;color:var(--mut);margin-bottom:6px">Оберіть товари:</div>
      <input class="fi" id="ssearch" style="margin-bottom:8px" placeholder="🔍 Пошук..." value="${prevSearch}"/>
      <div style="max-height:180px;overflow-y:auto;border:1px solid var(--brd);border-radius:8px;margin-bottom:14px">${listHtml||'<div style="padding:14px;color:var(--dim);text-align:center">Нічого не знайдено</div>'}</div>
      <div class="mf">
        <button class="btn bg" id="scancel">Скасувати</button>
        <button class="btn bp" id="ssave">Продати (${saleItems.length})</button>
      </div>`;

    $('mx').onclick=hide;$('scancel').onclick=hide;
    const captureHeader=()=>{if($('sdate2'))sDate=$('sdate2').value;if($('sclient'))sClient=$('sclient').value;};
    $('sdate2').addEventListener('change',captureHeader);
    $('sclient').addEventListener('input',captureHeader);
    $('ssearch').addEventListener('input',e=>{
      const v=e.target.value;
      const fil3=mats.filter(m=>!v||m.name.toLowerCase().includes(v.toLowerCase()));
      document.querySelector('#modal [style*="max-height:180px"]').innerHTML=
        fil3.map(m=>`<div style="padding:10px 14px;border-bottom:1px solid var(--brd);cursor:pointer;display:flex;justify-content:space-between" data-add="${m.id}">
          <span style="font-size:13px">${m.name}</span><span style="font-size:12px;color:var(--mut)">${m.qty} шт</span>
        </div>`).join('') || '<div style="padding:14px;color:var(--dim);text-align:center">Нічого не знайдено</div>';
      bindAddBtns();
    });
    function bindAddBtns(){
      $('modal').querySelectorAll('[data-add]').forEach(el2=>{
        el2.onclick=()=>{
          captureHeader();
          const m=mats.find(x=>x.id===el2.dataset.add);
          // Retail price defaults to the material's saved sale price; if
          // none was set yet, fall back to its cost so the field is never
          // blank/zero by surprise — the person can still edit it inline.
          const defPrice=m?.sellPrice||m?.avgPrice||m?.price||0;
          saleItems.push({matId:el2.dataset.add,qty:1,price:defPrice});
          render($('ssearch').value);
        };
      });
    }
    bindAddBtns();
    $('modal').querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{captureHeader();saleItems.splice(+b.dataset.rem,1);render($('ssearch')?.value||'');});
    function updateItemSum(idx){
      const it=saleItems[idx],m=mats.find(x=>x.id===it.matId);
      const cost=m?.avgPrice||m?.price||0,lineSell=it.qty*(it.price||0),lineCost=it.qty*cost,margin=lineSell-lineCost;
      const sumEl=$('modal').querySelector(`[data-sum="${idx}"]`);
      if(sumEl)sumEl.innerHTML=`<span>Собівартість: ${lineCost.toFixed(2)} грн</span><span style="color:${margin>=0?'var(--ok)':'var(--err)'};font-weight:600">Маржа: ${margin.toFixed(2)} грн</span>`;
      const totalSell2=saleItems.reduce((s,x)=>s+x.qty*(x.price||0),0);
      const totalCost2=saleItems.reduce((s,x)=>{const mm=mats.find(y=>y.id===x.matId);return s+x.qty*(mm?.avgPrice||mm?.price||0);},0);
      const totalEl=$('modal').querySelector('[data-grandtotal]');
      const marginEl=$('modal').querySelector('[data-grandmargin]');
      if(totalEl)totalEl.textContent='Разом продаж: '+totalSell2.toFixed(2)+' грн';
      if(marginEl){marginEl.textContent='Маржа: '+(totalSell2-totalCost2).toFixed(2)+' грн';marginEl.style.color=(totalSell2-totalCost2)>=0?'var(--ok)':'var(--err)';}
    }
    $('modal').querySelectorAll('[data-qty]').forEach(inp=>inp.addEventListener('input',()=>{saleItems[+inp.dataset.qty].qty=+inp.value||0;updateItemSum(+inp.dataset.qty);}));
    $('modal').querySelectorAll('[data-price]').forEach(inp=>inp.addEventListener('input',()=>{saleItems[+inp.dataset.price].price=+inp.value||0;updateItemSum(+inp.dataset.price);}));
    $('ssave').onclick=async()=>{
      captureHeader();
      if(saleItems.length===0){alert('Додайте товари');return;}
      for(const it of saleItems){
        const m=mats.find(x=>x.id===it.matId);
        if(!m)continue;
        if(it.qty>m.qty&&!confirm(`«${m.name}»: на складі лише ${m.qty} шт, а продається ${it.qty}. Продовжити (залишок піде в мінус)?`))return;
      }
      const date=sDate,note=sClient;
      // One shared id per "чек" (receipt) — same grouping pattern as the
      // Прихід накладна, so Історія can show one card per sale instead of
      // one row per item.
      const batchId='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      const ws=[],live={};
      for(const it of saleItems){
        const m=mats.find(x=>x.id===it.matId);if(!m)continue;
        const cost=m.avgPrice||m.price||0;
        const curQ=live[it.matId]!==undefined?live[it.matId]:(m.qty||0);
        const newQ=curQ-it.qty;live[it.matId]=newQ;
        ws.push(updateDoc(doc(db,'materials',it.matId),{qty:+newQ.toFixed(4)}));
        ws.push(addDoc(collection(db,'purchases'),{matId:it.matId,matName:m.name,type:'sale',qty:it.qty,unit:'шт',price:it.price,cost,total:it.qty*it.price,costTotal:it.qty*cost,margin:it.qty*(it.price-cost),date,note,batchId}));
      }
      hide();bgWrites(ws,'sale');
    };
  }
  show('');render();
}

// ── Inventory (звірка фактичних залишків) ───────────────────────────────
// For г/мл matherials with a tare weight configured, ticking "з тарою" lets
// the person type the raw scale reading (product + container) and the tare
// is subtracted automatically — no manual math needed every time.
function inventoryModal(){
  let invCat='Всі', invQ='';
  const entries={}; // matId -> {value, tare, tareCount}
  const captureInputs=()=>{
    $('modal').querySelectorAll('[data-invval]').forEach(inp=>{entries[inp.dataset.invval]={...entries[inp.dataset.invval],value:inp.value};});
    $('modal').querySelectorAll('[data-invtare]').forEach(cb=>{entries[cb.dataset.invtare]={...entries[cb.dataset.invtare],tare:cb.checked};});
    $('modal').querySelectorAll('[data-invtarecnt]').forEach(inp=>{entries[inp.dataset.invtarecnt]={...entries[inp.dataset.invtarecnt],tareCount:inp.value};});
  };
  function updateDiff(matId){
    const m=mats.find(x=>x.id===matId);if(!m)return;
    const{byG,unit,ppu,availUnits}=matUnitInfo(m);
    const inp=$('modal').querySelector(`[data-invval="${matId}"]`);
    const tareBox=$('modal').querySelector(`[data-invtare="${matId}"]`);
    const tareCntInp=$('modal').querySelector(`[data-invtarecnt="${matId}"]`);
    const diffEl=$('modal').querySelector(`[data-invdiff="${matId}"]`);
    if(!inp||!diffEl)return;
    if(!inp.value){diffEl.textContent='';return;}
    const raw=+inp.value;
    const tareCount=Math.max(1,+((tareCntInp?.value)||1));
    const actualNatural=(byG&&tareBox&&tareBox.checked)?Math.max(0,raw-(m.tare||0)*tareCount):raw;
    const curNatural=byG?availUnits:m.qty;
    const delta=actualNatural-curNatural;
    if(Math.abs(delta)<0.001){diffEl.textContent='Збігається';diffEl.style.color='var(--mut)';}
    else{
      const cost=Math.abs(delta)*ppu;
      diffEl.textContent=(delta>0?'+':'−')+Math.abs(delta).toFixed(1)+' '+unit+' · '+(delta>0?'лишок':'нестача')+' · '+fmt(cost)+' грн';
      diffEl.style.color=delta>0?'var(--ok)':'var(--err)';
    }
  }
  function render(){
    const fil=mats.filter(m=>(invCat==='Всі'||m.category===invCat)&&(!invQ||m.name.toLowerCase().includes(invQ.toLowerCase())));
    const rows=fil.map(m=>{
      const{byG,unit,availUnits}=matUnitInfo(m);
      const cur=entries[m.id]||{};
      const defaultTareCount=Math.max(1,Math.round(m.qty||1));
      return`<div class="ri" style="flex-direction:column;align-items:stretch;gap:6px">
        <div style="display:flex;justify-content:space-between">
          <div class="rn">${m.name}</div>
          <div class="rs">Система: ${byG?fmt(availUnits)+' '+unit:(Number.isInteger(m.qty)?m.qty:m.qty.toFixed(2))+' шт'}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="number" step="0.1" class="fi" data-invval="${m.id}" placeholder="Фактично (${unit})" value="${cur.value!==undefined?cur.value:''}" style="flex:1"/>
          ${byG&&m.tare>0?`<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mut);white-space:nowrap"><input type="checkbox" data-invtare="${m.id}" ${cur.tare?'checked':''}/> з тарою</label>`:''}
        </div>
        ${byG&&m.tare>0?`<div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:11px;color:var(--mut);white-space:nowrap">Кількість упаковок у зважуванні:</span>
          <input type="number" min="1" step="1" class="fi" data-invtarecnt="${m.id}" value="${cur.tareCount!==undefined?cur.tareCount:defaultTareCount}" style="width:64px;padding:6px 8px"/>
          <span style="font-size:11px;color:var(--dim)">(−${m.tare}г кожна)</span>
        </div>`:''}
        <div style="font-size:11px" data-invdiff="${m.id}"></div>
      </div>`;
    }).join('');
    $('modal').innerHTML=`
      <div class="mh"><div class="mt">⚖️ Інвентаризація</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:10px">Вписуйте фактично виміряну кількість лише для того, що звіряєте зараз — решту лишіть порожнім. Для товарів з тарою: увімкніть «з тарою» і вкажіть, скільки упаковок зважували разом — тара віднімається за кожну автоматично.</div>
      <input class="fi" id="invq" style="margin-bottom:8px" placeholder="🔍 Пошук..." value="${invQ}"/>
      <div class="chips">${['Всі',...CATS].map(c=>`<button class="chip ${invCat===c?'on':''}" data-ic="${c}">${c}</button>`).join('')}</div>
      ${rows||'<div class="empty">Нічого не знайдено</div>'}
      <div class="mf"><button class="btn bg" id="invcancel">Скасувати</button><button class="btn bp" id="invsave">Зберегти звірку</button></div>`;
    $('mx').onclick=hide;$('invcancel').onclick=hide;
    $('modal').querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{captureInputs();invCat=b.dataset.ic;render();});
    $('invq').addEventListener('input',e=>{
      captureInputs();invQ=e.target.value;render();
      setTimeout(()=>{const el2=$('invq');if(el2){el2.focus();el2.setSelectionRange(el2.value.length,el2.value.length);}},10);
    });
    $('modal').querySelectorAll('[data-invval]').forEach(inp=>inp.addEventListener('input',()=>updateDiff(inp.dataset.invval)));
    $('modal').querySelectorAll('[data-invtare]').forEach(cb=>cb.addEventListener('change',()=>updateDiff(cb.dataset.invtare)));
    $('modal').querySelectorAll('[data-invtarecnt]').forEach(inp=>inp.addEventListener('input',()=>updateDiff(inp.dataset.invtarecnt)));
    fil.forEach(m=>updateDiff(m.id));
    $('invsave').onclick=async()=>{
      captureInputs();
      const changed=Object.entries(entries).filter(([,v])=>v.value!==undefined&&v.value!=='');
      if(changed.length===0){alert('Впишіть хоча б одну фактичну кількість');return;}
      if(!confirm(`Зберегти звірку для ${changed.length} товар(ів)?`))return;
      const invWrites=[];
      let count=0;
      for(const[matId,v]of changed){
        const m=mats.find(x=>x.id===matId);if(!m)continue;
        const{byG,unit,ppu,availUnits}=matUnitInfo(m);
        const raw=+v.value;
        const tareCount=Math.max(1,+(v.tareCount||1));
        const actualNatural=(byG&&v.tare)?Math.max(0,raw-(m.tare||0)*tareCount):raw;
        const curNatural=byG?availUnits:m.qty;
        const delta=actualNatural-curNatural;
        if(Math.abs(delta)<0.001)continue;
        const newQtySht=byG?actualNatural/m.volPerUnit:actualNatural;
        invWrites.push(updateDoc(doc(db,'materials',matId),{qty:+newQtySht.toFixed(4)}));
        invWrites.push(addDoc(collection(db,'purchases'),{matId,matName:m.name,type:'adjustment',qty:delta,unit,total:delta*ppu,date:today(),note:'Інвентаризація'}));
        count++;
      }
      bgWrites(invWrites,'inventory');
      alert(`Скориговано ${count} товар(ів).`);
      hide();
    };
  }
  show('');render();
}

function spendModal(id){
  const m=mats.find(x=>x.id===id);
  const byG=m.spendUnit&&m.spendUnit!=='шт'&&m.volPerUnit>0;
  const totalU=byG?m.qty*m.volPerUnit:m.qty,ppu=m.avgPricePerUnit||m.pricePerUnit||0,unit=byG?m.spendUnit:'шт';
  show(`
    <div class="mh"><div class="mt">Списати: ${m.name}</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
    <div style="background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:10px;margin-bottom:13px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span style="color:var(--mut)">В наявності:</span><span style="font-weight:700;color:var(--acs)">${fmt(totalU)} ${unit} (${m.qty} шт)</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--mut)">Ціна за ${unit}:</span><span style="font-weight:700;color:var(--sil)">${(byG?ppu:m.avgPrice||m.price||0).toFixed(2)} грн</span></div>
    </div>
    <div class="field"><label>Кількість (${unit})</label><input type="number" class="fi" id="sqa" step="0.1" placeholder="0"/></div>
    <div id="scalc" style="background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:10px;margin-bottom:13px;display:none">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="color:var(--mut)">Вартість:</span><span id="scost" style="font-weight:700;color:var(--err)"></span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--mut)">Залишок:</span><span id="srem" style="font-weight:700;color:var(--acs)"></span></div>
    </div>
    <div class="field"><label>Дата</label><input type="date" class="fi" id="sdate" value="${today()}"/></div>
    <div class="field"><label>Примітка</label><input class="fi" id="snote" placeholder="Клієнт..."/></div>
    <div class="mf"><button class="btn bg" id="mc">Скасувати</button><button class="btn bp" id="ms">Списати</button></div>`);
  $('mx').onclick=hide;$('mc').onclick=hide;
  $('sqa').addEventListener('input',e=>{
    const q=+e.target.value||0;
    if(q>0){const cost=byG?q*ppu:q*(m.avgPrice||m.price||0),remU=totalU-q;$('scalc').style.display='';$('scost').textContent=cost.toFixed(2)+' грн';const remShts=byG?remU/m.volPerUnit:remU;$('srem').textContent=remU.toFixed(1)+' '+unit+' ('+remShts.toFixed(2)+' шт)';$('srem').style.color=remU<0?'var(--err)':'var(--acs)';}
    else $('scalc').style.display='none';
  });
  $('ms').onclick=async()=>{
    const q=+$('sqa').value;if(!q){alert('Введіть кількість');return;}
    // No floor at 0 here either — same reasoning as appointment write-offs:
    // spending ahead of a receive should show up as a temporary shortfall
    // that a later "Прихід" corrects, not a deduction that just vanishes.
    const newQty=byG?(totalU-q)/m.volPerUnit:m.qty-q;
    const total=byG?q*ppu:q*(m.avgPrice||m.price||0);
    const ws=[updateDoc(doc(db,'materials',id),{qty:+newQty.toFixed(4)}),
      addDoc(collection(db,'purchases'),{matId:id,matName:m.name,type:'spend',qty:q,unit,total,date:$('sdate').value,note:$('snote').value})];
    hide();bgWrites(ws,'spend');
  };
}

function historyModal(){
  function render(){
    const q=(histQ||'').toLowerCase();
    // Receive-type purchases are grouped back into one "накладна" card per
    // batchId (everything entered together in one receiveModal session) —
    // legacy entries saved before batchId existed fall back to one card per
    // document, so nothing old disappears. Spend entries stay individual,
    // since each one is tied to a specific piece of work, not an invoice.
    const receiveOps=ops.filter(o=>o.type==='receive');
    const saleOps=ops.filter(o=>o.type==='sale');
    const spendOps=ops.filter(o=>o.type==='spend');
    const adjOps=ops.filter(o=>o.type==='adjustment');
    const batches={};
    receiveOps.forEach(o=>{
      const key=o.batchId||('legacy-'+o.id);
      if(!batches[key])batches[key]={key,date:o.date,note:o.note,items:[]};
      batches[key].items.push(o);
      if(o.date>batches[key].date)batches[key].date=o.date;
    });
    // Sale-type purchases are grouped the same way, into one "чек" (receipt)
    // card per batchId — mirrors the Прихід накладна grouping above.
    const saleBatches={};
    saleOps.forEach(o=>{
      const key=o.batchId||('legacy-'+o.id);
      if(!saleBatches[key])saleBatches[key]={key,date:o.date,note:o.note,items:[]};
      saleBatches[key].items.push(o);
      if(o.date>saleBatches[key].date)saleBatches[key].date=o.date;
    });
    let entries=[];
    if(histType==='Всі'||histType==='Прихід'){
      Object.values(batches).forEach(b=>{
        const matches=!q||(b.note||'').toLowerCase().includes(q)||b.items.some(it=>(it.matName||'').toLowerCase().includes(q));
        if(matches)entries.push({kind:'receive',date:b.date,batch:b});
      });
    }
    if(histType==='Всі'||histType==='Продаж'){
      Object.values(saleBatches).forEach(b=>{
        const matches=!q||(b.note||'').toLowerCase().includes(q)||b.items.some(it=>(it.matName||'').toLowerCase().includes(q));
        if(matches)entries.push({kind:'sale',date:b.date,batch:b});
      });
    }
    if(histType==='Всі'||histType==='Витрата'){
      spendOps.forEach(o=>{
        if(!q||(o.matName||'').toLowerCase().includes(q))entries.push({kind:'spend',date:o.date,op:o});
      });
    }
    if(histType==='Всі'||histType==='Коригування'){
      adjOps.forEach(o=>{
        if(!q||(o.matName||'').toLowerCase().includes(q))entries.push({kind:'adjustment',date:o.date,op:o});
      });
    }
    entries.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    let lastDate=null,rows='';
    for(const e of entries){
      if(e.date!==lastDate){
        lastDate=e.date;
        rows+=`<div style="font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 6px">${fmtL(e.date)}</div>`;
      }
      if(e.kind==='receive'){
        const b=e.batch,total=b.items.reduce((s,it)=>s+(it.total||0),0);
        rows+=`<div style="border:1px solid var(--brd);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--card)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <div><div style="font-size:11px;font-weight:700;color:var(--ok)">📦 Прихід${b.note?' · '+b.note:''}</div>
            <div style="font-size:11px;color:var(--mut)">${b.items.length} поз.</div></div>
            <div style="text-align:right">
              <div style="font-weight:700;font-size:14px;color:var(--sil)">${fmt(total)} грн</div>
              <button class="bi bs" style="margin-top:4px" data-delbatch="${b.key}">${svg(ic.del,12,'var(--err)')}</button>
            </div>
          </div>
          ${b.items.map(it=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--brd);font-size:12px">
            <span>${it.matName||'?'} · ${it.qty} ${it.unit||'шт'}${it.disc?' -'+it.disc+'%':''}</span>
            <span style="color:var(--mut)">${fmt(it.total)} грн</span>
          </div>`).join('')}

        const b=e.batch,total=b.items.reduce((s,it)=>s+(it.total||0),0),margin=b.items.reduce((s,it)=>s+(it.margin!==undefined?it.margin:(it.total||0)-(it.costTotal||0)),0);
        rows+=`<div style="border:1px solid var(--brd);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--card)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <div><div style="font-size:11px;font-weight:700;color:var(--acs)">🛍️ Продаж${b.note?' · '+b.note:''}</div>

              <div style="font-weight:700;font-size:14px;color:var(--sil)">${fmt(total)} грн</div>
              <button class="bi bs" style="margin-top:4px" data-delsalebatch="${b.key}">${svg(ic.del,12,'var(--err)')}</button>
            </div>
          </div>
          ${b.items.map(it=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--brd);font-size:12px">

            <span style="color:var(--mut)">${fmt(it.total)} грн</span>
          </div>`).join('')}
        </div>`;
      } else if(e.kind==='spend'){
        const o=e.op;
        rows+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd)">
          <div style="flex:1"><div style="font-size:11px;font-weight:700;color:var(--err)">📉 Витрата ${o.backfilled?'<span style="color:var(--dim);font-weight:400">· підтягнуто ⓘ</span>':''}</div>
            <div style="font-size:13px;margin:2px 0">${o.matName||'?'}</div>
            <div style="font-size:11px;color:var(--mut)">${o.qty} ${o.unit||'шт'}${o.disc?' · -'+o.disc+'%':''}</div>
            ${o.note?`<div style="font-size:11px;color:var(--dim)">${o.note}</div>`:''}
          </div>
          <div style="text-align:right"><div style="font-weight:700;font-size:13px;color:var(--sil)">${fmt(o.total)} грн</div>
            <button class="bi bs" style="margin-top:4px" data-oid="${o.id}" data-omid="${o.matId}" data-otype="${o.type}" data-oqty="${o.qty}" data-obackfilled="${o.backfilled?1:0}">${svg(ic.x,12,'var(--err)')}</button>
          </div>

            <div style="font-size:13px;margin:2px 0">${o.matName||'?'}</div>
            <div style="font-size:11px;color:var(--mut)">${isSurplus?'+':'−'}${Math.abs(o.qty).toFixed(1)} ${o.unit||'шт'}</div>
          </div>
          <div style="text-align:right"><div style="font-weight:700;font-size:13px;color:${isSurplus?'var(--ok)':'var(--err)'}">${isSurplus?'+':'−'}${fmt(Math.abs(o.total))} грн</div>
            <button class="bi bs" style="margin-top:4px" data-oid="${o.id}" data-omid="${o.matId}" data-otype="${o.type}" data-oqty="${o.qty}" data-obackfilled="1">${svg(ic.x,12,'var(--err)')}</button>
          </div>
        </div>`;
      }
    }
    const pendingBackfill=appts.filter(a=>Array.isArray(a.materialsUsed)&&a.materialsUsed.length>0&&a.status!=='cancelled'&&!a.materialsHistoryBackfilled);
    $('modal').innerHTML=`
      <div class="mh"><div class="mt">Історія операцій</div><button class="bi" id="mx">${svg(ic.x,18)}</button></div>
      <div class="chips">${['Всі','Прихід','Продаж','Витрата','Коригування'].map(t=>`<button class="chip ${histType===t?'on':''}" data-ht="${t}">${t}</button>`).join('')}</div>
      ${pendingBackfill.length?`<button class="btn bg bs" id="hbackfill" style="margin-bottom:10px;width:100%;justify-content:center">🔄 Підтягнути старі списання з записів (${pendingBackfill.length})</button>`:''}
      <input class="fi" id="hq" style="margin-bottom:10px" placeholder="🔍 Пошук за назвою чи постачальником..." value="${histQ}"/>
      ${entries.length===0?'<div class="empty">Нічого не знайдено</div>':rows}`;
    $('mx').onclick=hide;
    if($('hbackfill'))$('hbackfill').onclick=async()=>{
      if(backfillRunning)return; // guards against a double-tap firing this twice, which is what caused duplicates
      if(!confirm(`Додати в Історію ${pendingBackfill.length} старих запис(ів) списання матеріалів з карток клієнтів? Це НЕ вплине на поточні залишки — лише додасть записи в історію.`))return;
      backfillRunning=true;
      $('hbackfill').disabled=true;$('hbackfill').style.opacity='.5';
      let count=0;
      for(const a of pendingBackfill){
        for(const mu of a.materialsUsed){
          const m=mats.find(x=>x.id===mu.matId);if(!m||!mu.qty)continue;
          const{unit,ppu}=matUnitInfo(m);
          await addDoc(collection(db,'purchases'),{matId:mu.matId,matName:m.name,type:'spend',qty:mu.qty,unit,total:mu.qty*ppu,date:a.date,note:a.client,apptId:a.id,backfilled:true});
          count++;
        }
        await updateDoc(doc(db,'appointments',a.id),{materialsHistoryBackfilled:true});
      }
      backfillRunning=false;
      alert(`Додано ${count} записів в історію.`);
      render();
    };
    $('modal').querySelectorAll('[data-ht]').forEach(b=>b.onclick=()=>{histType=b.dataset.ht;render();});
    $('hq').addEventListener('input',e=>{
      histQ=e.target.value;render();
      setTimeout(()=>{const el2=$('hq');if(el2){el2.focus();el2.setSelectionRange(el2.value.length,el2.value.length);}},10);
    });
    $('modal').querySelectorAll('[data-oid]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Скасувати?'))return;
      // Backfilled entries were created purely as historical documentation
      // of a spend that already happened long ago — they never touched
      // stock themselves, so deleting one must NOT add stock back (that
      // would incorrectly inflate the current balance).
      const ws=[];
      if(b.dataset.obackfilled!=='1'){
        const m=mats.find(x=>x.id===b.dataset.omid);
        if(m){const q2=+b.dataset.oqty,nq=b.dataset.otype==='receive'?m.qty-q2:m.qty+q2;ws.push(updateDoc(doc(db,'materials',b.dataset.omid),{qty:+nq.toFixed(4)}));}
      }
      ws.push(deleteDoc(doc(db,'purchases',b.dataset.oid)));hide();bgWrites(ws,'op-del');
    });
    $('modal').querySelectorAll('[data-delbatch]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Скасувати всю накладну? Це поверне залишки по всіх позиціях у ній.'))return;
      const batch=batches[b.dataset.delbatch];
      const ws=[],live={};
      for(const it of batch.items){
        const m=mats.find(x=>x.id===it.matId);
        if(m){const curQ=live[it.matId]!==undefined?live[it.matId]:m.qty;const nq=curQ-(it.qty||0);live[it.matId]=nq;ws.push(updateDoc(doc(db,'materials',it.matId),{qty:+nq.toFixed(4)}));}
        ws.push(deleteDoc(doc(db,'purchases',it.id)));
      }
      hide();bgWrites(ws,'batch-del');
    });
    // Cancelling a sale returns the sold items to stock (opposite sign
    // from cancelling a Прихід, since a sale subtracted stock rather than
    // adding it).
    $('modal').querySelectorAll('[data-delsalebatch]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Скасувати весь чек продажу? Це поверне товари на склад.'))return;
      const batch=saleBatches[b.dataset.delsalebatch];
      const ws=[],live={};
      for(const it of batch.items){
        const m=mats.find(x=>x.id===it.matId);
        if(m){const curQ=live[it.matId]!==undefined?live[it.matId]:m.qty;const nq=curQ+(it.qty||0);live[it.matId]=nq;ws.push(updateDoc(doc(db,'materials',it.matId),{qty:+nq.toFixed(4)}));}
        ws.push(deleteDoc(doc(db,'purchases',it.id)));
      }
      hide();bgWrites(ws,'sale-batch-del');
    });
  }
  show("");render();
}
